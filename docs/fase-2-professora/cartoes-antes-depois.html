<h1>Tela Cartões: antes e depois</h1><p class="sub">O antes é a tela de hoje. O depois é a tela nova no Design System, com dados de exemplo, nos dois cursos e nos dois temas. Tem três abas: criar cartão, cartões criados e Banco de Revisão (por enquanto só um aviso).</p><h2>Antes</h2><div class="grade"><figure><img src="docs/fase-2-professora/antes-flashcards.jpg" alt="Tela atual de Cartões"><figcaption>Hoje: quatro blocos numa página só (alunos, destino, novo cartão e a lista no fim), com ícones sem texto.</figcaption></figure></div><h2>Depois</h2><div class="grade"><figure><img loading="lazy" src="docs/fase-2-professora/depois-cartoes-fr-light.jpg" alt="Cartões, Francês, claro"><figcaption>Francês, claro</figcaption></figure><figure><img loading="lazy" src="docs/fase-2-professora/depois-cartoes-zh-dark.jpg" alt="Cartões, Mandarim, escuro"><figcaption>Mandarim, escuro</figcaption></figure><figure><img loading="lazy" src="docs/fase-2-professora/depois-cartoes-fr-dark.jpg" alt="Cartões, Francês, escuro"><figcaption>Francês, escuro</figcaption></figure><figure><img loading="lazy" src="docs/fase-2-professora/depois-cartoes-zh-light.jpg" alt="Cartões, Mandarim, claro"><figcaption>Mandarim, claro</figcaption></figure></div>
