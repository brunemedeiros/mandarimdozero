<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia: página "Parar de receber" (cartões novos)</title>
<style>
:root{--bg:#FAF5EA;--card:#fff;--ink:#22113f;--soft:#5d4f72;--band:#3D167B;--pink:#E36BCA;--box:#FAF5EA;--line:#ece4f2;--link:#1d6fa5;--chip:#fff;--chipb:#cfc3e3}
:root[data-theme=dark]{--bg:#17141F;--card:#201C2B;--ink:#EEE9F5;--soft:#ADA5BE;--band:#3D167B;--box:#2a2538;--line:#362F44;--link:#6CB8E6;--chip:#2a2538;--chipb:#4a4060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Helvetica Neue',Arial,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:10px;background:#22113f;color:#FAF5EA;font-size:13px;position:sticky;top:0;z-index:5}
.bar b{margin-right:6px}.bar button{font:inherit;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;border:1.5px solid #E36BCA;background:transparent;color:#f6c4ec;cursor:pointer}
.bar button.on{background:#E36BCA;color:#22113f}
.wrap{max-width:520px;margin:28px auto 8px;padding:0 16px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(34,17,63,.12)}
.band{background:var(--band);color:#FAF5EA;padding:26px 28px 24px}
.pill{display:inline-block;border:1.5px solid var(--pink);color:#f6c4ec;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 12px;text-transform:uppercase}
h1{font-family:'Anton','Impact','Arial Narrow',sans-serif;font-weight:400;font-size:34px;line-height:1.1;margin:14px 0 0;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--pink)}
.body{padding:24px 28px 8px}
p{margin:0 0 16px;line-height:1.65;font-size:16px}
.ok{background:var(--box);border-radius:16px;padding:14px 16px;margin:0 0 18px;display:flex;gap:10px;line-height:1.5}
.ok i{font-style:normal;color:#3498D6;font-weight:900}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:16px;color:#22113f;background:var(--pink);border:2px solid #22113f;box-shadow:4px 4px 0 #22113f;border-radius:999px;padding:14px 22px;cursor:pointer;margin:0 0 14px}
.btn2{display:block;width:100%;font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:transparent;border:2px solid var(--chipb);border-radius:999px;padding:12px 22px;cursor:pointer;margin:0 0 14px}
.link{background:none;border:0;font:inherit;color:var(--link);text-decoration:underline;cursor:pointer;padding:0}
.undo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 0;margin:0 0 6px;font-size:15px}
.undo .btn3{font:inherit;font-weight:900;font-size:14px;color:#22113f;background:var(--pink);border:2px solid #22113f;border-radius:999px;padding:8px 16px;cursor:pointer}
.why{border-top:1px solid var(--line);padding-top:16px}.why h2{font-size:17px;margin:0 0 4px}.why small{display:block;color:var(--soft);margin:0 0 12px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--chip);border:2px solid var(--chipb);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--band);color:#FAF5EA;border-color:var(--band)}
textarea{width:100%;font:inherit;border:2px solid var(--chipb);border-radius:14px;padding:10px 12px;background:var(--chip);color:var(--ink);min-height:70px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;margin:0 0 16px}.row .btn{width:auto;margin:0;flex:1}
.sig{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);margin:8px 28px 0;padding:16px 0 22px;font-size:14px;line-height:1.4;color:var(--soft)}
.sig img{width:52px;height:52px;border-radius:50%;border:2px solid var(--pink)}.sig b{color:var(--ink);display:block}
.foot{text-align:center;font-size:12px;color:var(--soft);margin:14px 0 0}
.note{max-width:520px;margin:16px auto 40px;padding:0 16px;font-size:13px;line-height:1.55;color:var(--soft)}
.note div{background:var(--box);border-radius:14px;padding:12px 14px}.note b{color:var(--ink)}
[hidden]{display:none!important}
</style></head><body>

<span style="width:10px"></span><button id="lang">EN</button><button id="th">Escuro</button></div>

var T={pt:{pill:'Cartões novos da professora',sg:'sua professora de idiomas',ft:'app.profbrune.com.br',
 ask:{h:'Quer mesmo <em>sair</em> da lista?',p:'Eu te aviso por e-mail quando coloco cartões novos para você revisar. Se está chegando coisa demais, tem um jeito mais leve de continuar.',go:'Sim, parar de receber',alt:'Prefiro 1 resumo por semana',keep:'Continuar recebendo'},
 done:{h:'Pronto, você <em>saiu</em> da lista',ok:'Você não vai mais receber o e-mail de cartões novos da sua professora. Seus cartões continuam no site.',un:'Foi sem querer?',unb:'Voltar a receber',wh:'Posso saber o motivo?',ws:'É opcional e leva 5 segundos. Eu leio e uso para melhorar o aviso. A resposta não fica no seu perfil de estudo.',send:'Enviar',skip:'Pular',oth:'Conte em poucas palavras (opcional)',
  r:['Recebo e-mails demais','Não é mais do meu interesse','Os cartões não servem para mim','Estou sem tempo agora','Prefiro ver tudo no site','Outro motivo']},
 thanks:{h:'Obrigada, <em>anotei</em>!',p:'Sua resposta me ajuda a deixar o aviso melhor. Se mudar de ideia, é só ligar de novo em Configurações > Notificações, dentro do site.',un:'Foi sem querer?',unb:'Voltar a receber'},
 back:{h:'Que bom que <em>voltou</em>!',p:'Os e-mails de cartões novos voltaram para a sua caixa. Quando quiser ajustar, é em Configurações > Notificações, dentro do site.',go:'Abrir o site'},

 note:'<b>Nota da prévia (não aparece na página):</b> 1) botão de desfazer e a tela de motivo ficam só com a assinatura do link, sem login. 2) Motivos: lista montada a partir da pesquisa de 12 marcas (recebo demais, não me interessa mais, conteúdo irrelevante, mais Outro); "nunca me cadastrei" ficou de fora porque não se aplica a alunas. 3) O resumo semanal ainda não existe como e-mail: precisa ser construído (e a escolha guardada em uma migration). 4) Tudo em pt-BR e en; no en não há português. 5) A foto e o tom são os da assinatura dos seus e-mails.'},
en:{pill:'New cards from your teacher',sg:'your language teacher',ft:'app.profbrune.com.br',
