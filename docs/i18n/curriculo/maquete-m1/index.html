/* ===== Tokens copiados de fr/index.html (os mesmos nomes e valores do site) ===== */
:root{
  --seal-red:#3498D6; --seal-red-dark:#1D5A82; --imperial-gold:#E36BCA; --hover-gold:#C9973A; --gold-bright:#F2A8DE;
  --brand-purple:#3D167B; --error-red:#D62619; --ink:#201335; --paper:#FAF5EA; --paper-warm:#F0E8D8; --paper-line:#E1D6C0;
  --jade:#3A7359; --ink-soft:#5C4E73; --on-vivid:#FFFFFF; --error-red-text:#B81F13; --on-seal-red:#201335;
  --count-learning:#B3261E; --grade-hard-bg:#8C5F0E; --dc-slot-1:#7C5CFA;
  --font-body:'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius:14px; --btn-depth:4px; --btn-depth-sm:3px;
  --shadow-card:0 2px 8px rgba(33,23,20,0.08), 0 1px 2px rgba(33,23,20,0.06);
  --shadow-lift:0 8px 24px rgba(33,23,20,0.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --seal-red:#4DA9E8; --seal-red-dark:#7FC4F5; --imperial-gold:#F08FE0; --hover-gold:#D9AE55; --gold-bright:#F7C2ED;
    --brand-purple:#8B6FE0; --error-red:#FF6B5C; --ink:#EDE6F5; --paper:#17121F; --paper-warm:#201A2C; --paper-line:#362C42;
    --jade:#52B487; --ink-soft:#C5B8D9; --on-vivid:#201335; --error-red-text:#FF6B5C;
    --count-learning:#FF7B6E; --grade-hard-bg:#C9973A; --dc-slot-1:#9A85FF;
    --shadow-lift:0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
  }
}
:root[data-theme="dark"]{
  --seal-red:#4DA9E8; --seal-red-dark:#7FC4F5; --imperial-gold:#F08FE0; --hover-gold:#D9AE55; --gold-bright:#F7C2ED;
  --brand-purple:#8B6FE0; --error-red:#FF6B5C; --ink:#EDE6F5; --paper:#17121F; --paper-warm:#201A2C; --paper-line:#362C42;
  --jade:#52B487; --ink-soft:#C5B8D9; --on-vivid:#201335; --error-red-text:#FF6B5C;
  --count-learning:#FF7B6E; --grade-hard-bg:#C9973A; --dc-slot-1:#9A85FF;
  --shadow-lift:0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
button, input, textarea, select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--imperial-gold); outline-offset:2px; border-radius:4px; }
body{
  background: var(--paper);
  background-image: radial-gradient(circle at 8% 8%, rgba(227,107,202,0.10) 0%, transparent 38%), radial-gradient(circle at 92% 88%, rgba(52,152,214,0.09) 0%, transparent 42%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.emo{display:inline-block;width:1.2em;height:1.2em;line-height:1.2em;vertical-align:-0.22em;background:var(--emo) center/contain no-repeat;color:transparent!important;-webkit-text-fill-color:transparent;text-shadow:none;overflow:hidden;white-space:nowrap;text-align:center;letter-spacing:0;font-style:normal;}

/* ===== Classes reais do site (fr/index.html), copiadas sem mudança de valor ===== */
.section-label{ font-size:15px; color:var(--ink); font-weight:900; margin:24px 0 10px; }
.lesson-focus-bar{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
.lesson-progress-track{ flex:1; height:8px; background: var(--paper-warm); border-radius:4px; overflow:hidden; }
.lesson-progress-fill{ height:100%; background: linear-gradient(90deg, var(--seal-red), var(--imperial-gold)); border-radius:4px; transition: width .3s ease; }
.acq-phase-banner{ text-align:center; font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color: var(--brand-purple); background: rgba(124,77,201,0.10); border-radius:20px; padding:6px 14px; margin:0 auto 16px; width:fit-content; max-width:100%; }
.vocab-card-counter{ display:flex; justify-content:center; align-items:center; gap:6px; margin-bottom:12px; }
.vocab-card-counter .vc-dot{ width:8px; height:8px; border-radius:50%; background:var(--paper-line); }
.vocab-card-counter .vc-dot.on{ background:var(--seal-red-dark); }
.vocab-card{ background: var(--paper-warm); border:1px solid var(--paper-line); border-radius: var(--radius); padding:32px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; }
.vocab-card-word{ font-size:30px; font-weight:800; color: var(--seal-red-dark); display:flex; align-items:center; gap:10px; justify-content:center; flex-wrap:wrap; }
.vocab-card-trans{ font-size:17px; color: var(--ink); margin-bottom:8px; }
.vocab-phrase-example{ background: var(--paper-warm); border:1px solid var(--paper-line); border-radius: var(--radius); padding:16px; text-align:center; }

.exercise-wrap{ text-align:center; padding:8px 0; animation: fadeUp .2s ease; }

.cloze-type-wrap{ text-align:center; width:100%; max-width:360px; margin:0 auto; }

  if (!EMO_RE || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const list = []; let n;
  while ((n = w.nextNode())){
    const p = n.parentNode;
    if (!p || p.closest('.emo, textarea, input, option, script, style')) continue;
    EMO_RE.lastIndex = 0;
    if (EMO_RE.test(n.nodeValue)) list.push(n);
  }
  list.forEach(node => {
    const t = node.nodeValue; const frag = document.createDocumentFragment(); let last = 0, m;
    EMO_RE.lastIndex = 0;
    while ((m = EMO_RE.exec(t))){
      if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'emo'; sp.style.setProperty('--emo', 'url("' + EMOJI[m[1]] + '")'); sp.textContent = m[0];
      frag.appendChild(sp); last = m.index + m[0].length;
    }
    if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) scanEmoji(n); else if (n.nodeType === 3 && n.parentNode) scanEmoji(n.parentNode); }))).observe(document.body, { childList: true, subtree: true });

/* ---------- áudio simulado: voz do navegador (se houver) + animação; sem voz, só anima ---------- */
let SPEAK_RUN = 0;
function speak(text, btn, rate){
  const run = ++SPEAK_RUN;
  $$('.audio-btn.speaking').forEach(b => b.classList.remove('speaking'));
  if (btn) btn.classList.add('speaking');
  return new Promise(resolve => {
    let done = false;
    const end = () => { if (done) return; done = true; if (btn) btn.classList.remove('speaking'); resolve(run === SPEAK_RUN); };
    const plain = String(text).replace(/‿/g, ' ');
    try {
      if (APP.voice && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'){
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(plain); u.lang = 'fr-FR'; u.rate = rate || 0.9;
        const v = (speechSynthesis.getVoices() || []).find(x => /^fr/i.test(x.lang)); if (v) u.voice = v;
        u.onend = () => setTimeout(end, 120); u.onerror = () => setTimeout(end, 400);
        speechSynthesis.speak(u);
      }
    } catch (e) {}
    setTimeout(end, Math.min(rate ? 8000 : 5200, 650 + plain.length * (rate ? 110 : 70)));
  });
}
function stopSpeak(){ SPEAK_RUN++; try { speechSynthesis.cancel(); } catch (e) {} $$('.audio-btn.speaking').forEach(b => b.classList.remove('speaking')); }
const ab = (text, cls) => `<button type="button" class="audio-btn ${cls || ''}" data-say="${esc(text)}" aria-label="Ouvir: ${esc(text)}">🔊</button>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b){ e.stopPropagation(); speak(b.dataset.say, b.classList.contains('audio-btn') ? b : null, b.dataset.slow ? 0.6 : 0); }
}, true);

/* ---------- comparação de resposta digitada (mesma regra do site: hífen, espaço e apóstrofo valem igual; acento errado = Quase) ---------- */
function canon(s){ return String(s).normalize('NFC').toLowerCase().replace(/[’`]/g, "'").replace(/[.!?,;:«»"]/g, '').replace(/[\s\-‐‑–']+/g, ' ').trim(); }
function loose(s){ return canon(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe'); }
function judge(given, forms){
  if (!canon(given)) return 'wrong';
  if (forms.some(f => canon(f) === canon(given))) return 'ok';
  if (forms.some(f => loose(f) === loose(given))) return 'almost';
  return 'wrong';
}
const ACCENTS = [['à', 'â'], ['ç'], ['é', 'è', 'ê', 'ë'], ['î', 'ï'], ['ô', 'œ'], ['ù', 'û', 'ü']];
const accentHTML = () => `<div class="fr-accent-picker">${ACCENTS.flat().map(c => `<button type="button" class="fr-accent-key">${c}</button>`).join('')}</div>`;
function wireAccents(root, input){
  $$('.fr-accent-key', root).forEach(k => {
    k.addEventListener('mousedown', e => e.preventDefault());
    k.addEventListener('click', () => {
      const s = input.selectionStart ?? input.value.length, e2 = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0, s) + k.textContent + input.value.slice(e2);
      input.focus(); input.setSelectionRange(s + 1, s + 1); input.dispatchEvent(new Event('input'));
    });
  });
}

/* ---------- moldura de lição: barra de progresso + faixa + conteúdo + Voltar/Continuar ---------- */
function flow(root, steps, opts){
  opts = opts || {};
  // Lâmpada só em lição com notas possíveis (vocabulário); gramática, Som, prova e défi não têm.
  const showBulb = opts.bulb !== undefined ? opts.bulb : !['m15', 'm17', 'som', 'pv', 'defi'].includes((SCREENS[APP.i] || {}).g);
  let i = 0;
  root.innerHTML = `<div class="mq-app">
      <div class="lesson-focus-bar"><div class="lesson-progress-track"><div class="lesson-progress-fill" style="width:0%"></div></div>
        <button class="lesson-close-btn" data-flag aria-label="Reportar problema" title="Reportar problema">⚑</button>
        ${!showBulb ? '' : `<button class="lesson-close-btn mq-bulb" data-bulb aria-label="${L('Notas desta lição', 'Notes from this lesson')}" title="${L('Notas desta lição', 'Notes from this lesson')}" aria-disabled="true" aria-expanded="false">💡</button>`}
        <button class="lesson-close-btn mq-kbd" data-kbd aria-label="Atalhos do teclado" title="Atalhos do teclado">⌨️</button>
        <button class="lesson-close-btn" data-x aria-label="Sair da lição" title="Sair da lição">✕</button></div>
      <div class="mq-pop" hidden></div>
      <div class="acq-phase-banner" hidden></div>
      <div class="mq-step"></div>
      <div class="mq-stepnav"><button class="btn btn-secondary" data-back>← Voltar</button><button class="btn btn-primary" data-next>Continuar →</button></div>
    </div>`;
  const app = $('.mq-app', root), box = $('.mq-step', app), fill = $('.lesson-progress-fill', app), banner = $('.acq-phase-banner', app);
  const back = $('[data-back]', app), next = $('[data-next]', app);
  const seen = [], bulb = $('[data-bulb]', app), pop = $('.mq-pop', app);
  const paintBulb = () => { if (!bulb) return; bulb.setAttribute('aria-disabled', String(!seen.length)); bulb.title = seen.length ? L('Notas desta lição', 'Notes from this lesson') + ` (${seen.length})` : L('Nenhuma nota nesta lição ainda', 'No notes in this lesson yet'); bulb.dataset.n = seen.length || ''; };
  if (bulb) bulb.addEventListener('click', () => {
    if (!seen.length) return; // ainda não apareceu nota nesta lição: o botão não faz nada
    const open = pop.hidden; pop.hidden = !open; bulb.setAttribute('aria-expanded', String(open));
    if (open){ pop.innerHTML = `<div class="mq-pop-head"><span>💡 ${L('Notas que você já viu nesta lição', 'Notes you have seen in this lesson')}</span><button class="lesson-close-btn" data-pclose aria-label="${L('Fechar', 'Close')}">✕</button></div>${seen.map(n => `<div class="mq-pop-note"><div class="mq-pop-title">${n.title}</div><div class="mq-pop-body">${n.body}</div></div>`).join('')}`; scanEmoji(pop); $('[data-pclose]', pop).addEventListener('click', () => { pop.hidden = true; bulb.setAttribute('aria-expanded', 'false'); }); }
  });
  $('[data-flag]', app).addEventListener('click', () => toast(L('Abriria o formulário de report (já existe no site)', 'Would open the report form (already on the site)')));
  $('[data-kbd]', app).addEventListener('click', () => toast(L('Atalhos do teclado (já existe no site)', 'Keyboard shortcuts (already on the site)')));
  $('[data-x]', app).addEventListener('click', () => toast(L('Na maquete, não sai da lição', 'In this mockup you stay in the lesson')));
  const api = {
    banner(t){ banner.hidden = !t; banner.textContent = t || ''; },
    next(label, show){ next.textContent = label || 'Continuar →'; next.style.display = show === false ? 'none' : ''; },
    showNext(){ next.style.display = ''; },
    go(n){ i = Math.max(0, Math.min(steps.length - 1, n)); paint(); },
    advance(){ if (i < steps.length - 1){ i++; paint(); } else if (opts.onEnd) opts.onEnd(); else nextScreen(); },
    get index(){ return i; },
  };
  function paint(){
    stopSpeak();
    fill.style.width = (((i + 1) / steps.length) * (opts.progressMax || 100)) + '%';
    api.banner(''); api.next('Continuar →', true);
    back.style.visibility = i === 0 ? 'hidden' : 'visible';
    box.innerHTML = '';
    steps[i](box, api);
    $$('[data-note]', box).forEach(n => { const t = $('.gram-block-title', n), b = $('.gram-block-body', n); const key = t ? t.innerHTML : ''; if (t && !seen.some(x => x.key === key)) seen.push({ key, title: t.innerHTML, body: b ? b.innerHTML : '' }); });
    paintBulb(); if (pop) pop.hidden = true; if (bulb) bulb.setAttribute('aria-expanded', 'false');
    scanEmoji(box);
  }
  back.addEventListener('click', () => { if (i > 0){ i--; paint(); } });
  next.addEventListener('click', () => api.advance());
  paint();
  return api;
}

function tfStep(items){
  return (box, api) => {
    api.banner(L('💡 Confirme o que você leu', '💡 Check what you just read'));
    box.innerHTML = `<div class="mq-opt-block">
      <div class="mq-opt-head"><span>${L('Verdadeiro ou falso?', 'True or false?')}</span>${tag('novo')}</div>
      <div class="mq-small">${L('Mini-passo da lição, logo depois da nota. Não vale XP nem entra na Revisão. Certa ou errada, a resposta mostra a mesma explicação curta e você segue.', 'A short lesson step right after the note. No XP, nothing goes to Review. Right or wrong, you see the same short explanation and move on.')}</div>
      ${items.map((it, k) => `<div class="mq-tf" data-k="${k}">
        <div class="mq-tf-q">${items.length > 1 ? (k + 1) + '. ' : ''}${L(it.q, it.qEn)}</div>
        <div class="tf-options"><button class="tf-option" data-v="true">✅ ${L('Verdadeiro', 'True')}</button><button class="tf-option" data-v="false">❌ ${L('Falso', 'False')}</button></div>
        <div class="mq-tf-slot"></div></div>`).join('')}

    api.next(L('Continuar →', 'Continue →'), false);
    let left = items.length;
    $$('.mq-tf', box).forEach(el => {
      const it = items[Number(el.dataset.k)];
      $$('.tf-option', el).forEach(btn => btn.addEventListener('click', () => {
        if (el.dataset.done) return; el.dataset.done = '1';
        const ok = (btn.dataset.v === 'true') === it.a;
        $$('.tf-option', el).forEach(b => { b.classList.add('disabled'); if ((b.dataset.v === 'true') === it.a) b.classList.add('correct'); else if (b === btn) b.classList.add('incorrect'); });
        const head = ok ? L('Isso mesmo!', 'That\'s right!') : (it.a ? L('Na verdade, é verdadeiro.', 'Actually, it\'s true.') : L('Na verdade, é falso.', 'Actually, it\'s false.'));
        $('.mq-tf-slot', el).innerHTML = `<div class="mq-tf-fb ${ok ? 'ok' : 'no'}"><b>${head}</b> ${L(it.why, it.whyEn)}</div>`;

// Exercício de digitar (gramática: "Frase i de n"; vocabulário: "Digite o que ouviu")
function typeEx(box, api, o){
  // o: {counter, label, prompt (html), hint, audio, answer, alt:[], onAnswer(result), accent}
  box.innerHTML = `<div class="exercise-wrap">
    ${o.counter ? `<div class="${o.gram ? 'conj-progress' : 'exercise-counter'}">${o.counter}</div>` : ''}
    ${o.label ? `<div class="exercise-prompt-label">${o.label}</div>` : ''}
    ${o.audio ? `<div class="exercise-prompt">${ab(o.audio, 'audio-btn-lg')}<div class="prompt-audio-hint">toque para ouvir de novo</div></div>` : ''}
    ${o.gram ? `<div class="gram-exercise"><div class="gram-exercise-prompt">${o.prompt}</div>${o.hint ? `<div class="gram-exercise-hint">${o.hint}</div>` : ''}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite a forma correta" aria-label="Resposta"><div class="expected"></div></div>${accentHTML()}<button class="btn btn-primary btn-block" data-verify>Verificar</button>`
      : `${o.prompt ? `<div class="exercise-prompt"><div class="prompt-translation">${o.prompt}</div></div>` : ''}<div class="cloze-type-wrap"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${o.placeholder || 'Digite em francês'}" aria-label="Resposta">${accentHTML()}<button class="btn btn-primary btn-block" data-verify>Verificar</button></div>`}
    <div class="mq-fb-slot"></div></div>`;
  const input = $('input', box), verify = $('[data-verify]', box);
  wireAccents(box, input);
  api.next('Continuar →', false);
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); verify.click(); } });
  verify.addEventListener('click', () => {
    const r = judge(input.value, [o.answer, ...(o.alt || [])]);
    input.disabled = true; verify.style.display = 'none';
    $$('.fr-accent-key', box).forEach(k => k.disabled = true);
    const slot = $('.mq-fb-slot', box);
    if (o.gram){
      const g = $('.gram-exercise', box); g.classList.add(r === 'ok' ? 'ok' : r === 'almost' ? 'almost' : 'wrong');
      $('.expected', box).textContent = r === 'ok' ? '' : r === 'almost' ? `Quase! → ${o.answer}` : `→ ${o.answer}`;
      slot.innerHTML = `<div class="mq-small" style="margin-top:10px">${r === 'ok' ? 'Certo: 1 ponto.' : r === 'almost' ? 'Quase: só o acento. Meio ponto.' : 'Errado: 0 ponto. A forma certa aparece embaixo do campo.'}</div>`;
    } else {
      slot.innerHTML = r === 'ok' ? feedbackPanel('ok', praise(), `<strong>${esc(o.answer)}</strong> ${ab(o.answer)}`, null)
        : r === 'almost' ? feedbackPanel('almost', '🎯 Quase lá', `Faltou o acento: <strong>${esc(o.answer)}</strong> ${ab(o.answer)}<div class="mq-small" style="margin-top:6px">Conta meio ponto.</div>`, null)
        : feedbackPanel('wrong', '❌ Não foi dessa vez', `<div class="wrong-feedback-why-label">Sua resposta</div><div>${esc(input.value || '(vazio)')}</div><div class="wrong-feedback-why-label" style="margin-top:10px">Resposta certa</div><div><strong>${esc(o.answer)}</strong> ${ab(o.answer)}</div>`, null);
    }
    const again = document.createElement('button'); again.className = 'btn btn-secondary btn-sm'; again.style.marginTop = '12px'; again.textContent = '↺ Tentar de novo (só na maquete)';
    again.addEventListener('click', () => typeEx(box, api, o));
    slot.appendChild(again);
    if (o.onAnswer) o.onAnswer(r);
    api.showNext(); api.next(o.nextLabel || 'Continuar →', true);
  });
}

/* ---------- Diálogo: réplica do site (fr/app.js renderDialogueStep) ---------- */
function dlgTerms(vocab){
  const terms = [];
  vocab.forEach(v => String(v.f).split(' / ').forEach(part => {
    const t = part.replace(/\s*\([^)]*\)/g, '').trim(); if (!t) return;
    terms.push({ t, tr: v.t });
    const bare = t.replace(/^(le|la|les|l'|un|une|des) ?/i, '');
    if (bare !== t && bare.length >= 3) terms.push({ t: bare, tr: v.t, plural: true });
  }));
  return terms.sort((a, b) => b.t.length - a.t.length);
}
function dlgHighlight(text, terms){
  if (!terms.length) return esc(text);
  const e = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp("(?<![\\p{L}'’-])(" + terms.map(x => e(x.t) + (x.plural ? 's?' : '')).join('|') + ")(?![\\p{L}-])", 'giu');
  const map = new Map(terms.map(x => [x.t.toLowerCase(), x.tr]));
  let out = '', last = 0, m;
  while ((m = re.exec(text))){
    out += esc(text.slice(last, m.index));
    const low = m[1].toLowerCase(); const tr = map.get(low) || map.get(low.replace(/s$/, '')) || '';
    out += `<span class="dlg-new" data-tr="${esc(tr)}" data-w="${esc(m[1])}">${esc(m[1])}</span>`;
    last = m.index + m[1].length;
  }
  return out + esc(text.slice(last));
}
function wireNewWords(root){
  $$('.dlg-new', root).forEach(w => w.addEventListener('click', e => { e.stopPropagation(); if (w.dataset.tr) toast(`“${w.dataset.w}” = ${w.dataset.tr}`); }));
}
function dlgToday(box, d){
  const terms = dlgTerms(d.vocab);
  const rows = d.lines.map((l, i) => {
    const side = l.spk === 'B' ? 'b' : 'a', who = d.speakers[l.spk];
    return `<div class="dlg-row ${side}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(who.n)}: ouvir a partir desta fala">
      <div class="dlg-avatar"><span class="dlg-emoji" aria-hidden="true">${who.e}</span><span class="dlg-name">${esc(who.n)}</span></div>
      <div class="dlg-bubble"><div class="dlg-fr">${dlgHighlight(l.f, terms)}<span class="dlg-wave" aria-hidden="true"><i></i><i></i><i></i></span></div>
        <div class="dlg-tr">${esc(l.t)}</div>
        <button type="button" class="dlg-trbtn" data-real-size aria-label="Mostrar a tradução desta fala" aria-pressed="false">🌐</button></div></div>`;
  }).join('');
  box.innerHTML = `<div class="section-label" style="margin-top:0">Diálogo</div>
    <div class="dlg-title">${esc(d.title)}</div>
    ${d.scene ? `<div class="dlg-scene">📍 ${esc(d.scene)}</div>` : ''}
    <div class="dlg-tools"><button class="btn btn-secondary dlg-play-btn" data-play>▶ Ouvir tudo</button>
      <button class="dlg-chip" data-auto aria-pressed="false">Áudio automático: desligado</button></div>
    <div class="dlg-chat">${rows}</div>
    <div class="dlg-float"><button class="dlg-chip dlg-chip-float" data-trans aria-pressed="false">🌐 Mostrar traduções</button></div>
    <div class="dlg-legend">As palavras coloridas são do vocabulário desta unidade. Toque numa delas para ver o significado.</div>`;
  const chat = $('.dlg-chat', box), play = $('[data-play]', box), trans = $('[data-trans]', box), auto = $('[data-auto]', box);
  const R = $$('.dlg-row', chat);

/* ---------- "Você entendeu?" (réplica de renderDialogueCheck) ---------- */
function dlgCheck(box, api, d){
  let qi = 0, correct = 0;
  const sp = d.speakers;
  const bubble = (idx, text, blank) => { const l = d.lines[idx], side = l.spk === 'B' ? 'b' : 'a', who = sp[l.spk];
    return `<div class="dlg-row ${side} static"><div class="dlg-avatar"><span class="dlg-emoji" aria-hidden="true">${who.e}</span><span class="dlg-name">${esc(who.n)}</span></div><div class="dlg-bubble"><div class="dlg-fr">${blank ? '<span class="dlg-blank">· · · · ·</span>' : esc(text)}</div></div></div>`; };
  box.innerHTML = `<div class="section-label" style="margin-top:0">Diálogo</div><div class="dlg-title">${esc(d.title)}</div>
    <div class="dlg-scene">Sem olhar o diálogo: o que você entendeu da conversa?</div><div class="dlg-check"></div>`;
  const host = $('.dlg-check', box);
  api.next('Continuar →', false);
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  function show(){
    const q = d.check[qi]; let label, ctx, opts;
    if (q.k === 'fill'){ label = 'Complete a resposta'; ctx = `<div class="dlg-q-ctx">${bubble(q.line - 1, d.lines[q.line - 1].f)}${bubble(q.line, '', true)}</div>`; opts = shuffle([{ t: d.lines[q.line].f, ok: true }, ...q.bad.map(t => ({ t, ok: false }))]); }
    else if (q.k === 'listen'){ label = 'Ouça e escolha a resposta'; ctx = `<div class="dlg-q-listen">${ab(d.lines[q.line].f, 'audio-btn-lg')}<div class="prompt-audio-hint">toque para ouvir de novo</div></div>`; opts = shuffle([{ t: d.lines[q.line + 1].f, ok: true }, ...q.bad.map(t => ({ t, ok: false }))]); }
    else { label = 'Compreensão'; ctx = `<div class="dlg-q-text">${esc(q.q)}</div>`; opts = q.opts.map((t, k) => ({ t, ok: k === q.ok })); }
    host.innerHTML = `<div class="dlg-check-head"><span>Você entendeu?</span><span class="dlg-dots">${d.check.map((_, k) => `<span class="dlg-dot${k < qi ? ' done' : k === qi ? ' on' : ''}"></span>`).join('')}</span></div>
      <div class="exercise-prompt-label">${label}</div>${ctx}
      <div class="dlg-opts">${opts.map((o, k) => `<button class="dlg-opt" data-k="${k}">${esc(o.t)}</button>`).join('')}</div><div class="dlg-fb-slot"></div>`;
    scanEmoji(host);
    $$('.dlg-opt', host).forEach(btn => btn.addEventListener('click', () => {
      const o = opts[Number(btn.dataset.k)];
      $$('.dlg-opt', host).forEach((b, k) => { b.disabled = true; b.classList.add('locked'); if (opts[k].ok) b.classList.add('correct'); });
      if (!o.ok) btn.classList.add('incorrect'); else correct++;
      const right = opts.find(x => x.ok).t, last = qi === d.check.length - 1;
      $('.dlg-fb-slot', host).innerHTML = `<div class="dlg-fb ${o.ok ? 'ok' : 'no'}"><div class="dlg-fb-title">${o.ok ? '✅ Isso mesmo!' : 'Quase! A resposta certa era:'}</div>${o.ok ? '' : `<div class="dlg-fb-right">${esc(right)}</div>`}<button class="btn btn-primary btn-block" data-qn>${last ? 'Concluir' : 'Próxima pergunta →'}</button></div>`;
      $('[data-qn]', host).addEventListener('click', () => { if (last) finish(); else { qi++; show(); } });
    }));
  }
  function finish(){
    host.innerHTML = `<div class="dlg-check-head"><span>Você entendeu?</span></div><div class="dlg-sum">${correct} de ${d.check.length} certas. ${correct === d.check.length ? 'Conversa entendida!' : 'Ouça de novo e tente outra vez quando quiser.'}</div><button class="dlg-chip" data-redo>Refazer as perguntas</button>`;
    $('[data-redo]', host).addEventListener('click', () => { qi = 0; correct = 0; show(); api.next('Continuar →', false); });
    api.next('Continuar →', true);
  }
  show();
}

function openSheet(html){
  const back = document.createElement('div'); back.className = 'mq-sheet-back';
  back.innerHTML = `<div class="mq-sheet" role="dialog" aria-modal="true">${html}<button class="btn btn-secondary btn-block" data-close style="margin-top:14px">${L('Fechar', 'Close')}</button></div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) close(); });
  $$('[data-goto]', back).forEach(b => b.addEventListener('click', () => { close(); goId(b.dataset.goto); }));
}

/* ---- M1.5 (g) ---- */
function gramExplain(root, blocks, toExercisesId){
  flow(root, blocks.map((b, k) => (box, api) => {
    box.innerHTML = `<div class="conj-progress">Passo ${k + 1} de ${blocks.length}</div>` + noteBlock(b);
    if (k === blocks.length - 1) api.next('Ir para os exercícios →');
  }), { onEnd: () => goId(toExercisesId) });
}
function gramExercises(root, list, done){
  let score = 0;
  flow(root, list.map((ex, k) => (box, api) => typeEx(box, api, { gram: true, counter: `Frase ${k + 1} de ${list.length}`, prompt: ex.p, hint: ex.h, answer: ex.a, alt: ex.alt, nextLabel: k < list.length - 1 ? 'Próxima frase →' : 'Ver resultado →', onAnswer: r => { score += r === 'ok' ? 1 : r === 'almost' ? 0.5 : 0; } }))
    .concat([(box, api) => { const pct = Math.round(score / list.length * 100);
      box.innerHTML = `<div style="text-align:center;padding:16px 4px"><div style="font-size:52px">🎉</div><h2 style="margin:0 0 12px">Unidade concluída!</h2><p style="font-size:15px;font-weight:700">${pct}% de acerto (${String(score).replace('.', ',')} de ${list.length})</p><p class="mq-small">Na maquete os pontos não são guardados.</p></div>`; api.next(done || 'Próxima tela →'); }]));
}
const TBL = (rows, heads) => `<div class="gram-tables">${heads.map((h, c) => `<div class="gram-table"><div class="gram-table-title">${h}</div>${rows.map(r => `<div class="gram-table-row"><span class="gram-table-pronoun">${r[0]}</span><span class="gram-table-form">${r[c + 1]}</span></div>`).join('')}</div>`).join('')}</div>`;

  gramExplain($('[data-f]', root), [
    { title: 'Avoir e être', body: '<strong>Avoir</strong> (ter) e <strong>être</strong> (ser/estar) são os dois verbos mais usados do francês, e os únicos totalmente irregulares no presente. Você já viu várias formas deles nas últimas unidades (<i>je suis, j\'ai, il a</i>...) sem parar para pensar na conjugação completa.', examples: [{ f: 'Je suis brésilienne.', t: 'Eu sou brasileira. (être)' }, { f: "J'ai vingt ans.", t: 'Eu tenho vinte anos. (avoir)' }] },
    { title: 'Nenhum padrão para deduzir', body: 'Nenhuma das duas conjugações segue um padrão regular: não dá para "deduzir" a forma a partir do infinitivo. Vale a pena memorizar a tabela inteira, não só as formas que você já viu.', examples: [{ f: 'Il a dix ans.', t: 'Ele tem dez anos. (avoir)' }, { f: 'Elle est française.', t: 'Ela é francesa. (être)' }] },
    { title: 'Uma pegadinha comum', body: 'O francês usa <strong>avoir</strong> (ter) em várias expressões em que o português usa "estar": <i>avoir faim</i> (estar com fome), <i>avoir soif</i> (estar com sede), <i>avoir raison</i> (estar certo).', examples: [{ f: "J'ai faim.", t: 'Estou com fome.' }, { f: 'Elle a raison.', t: 'Ela está certa.' }] },
    { title: 'Très bien! 🎉', wrapup: true, body: 'Aqui está a conjugação completa dos dois verbos antes de praticar:', after: TBL([['je', 'suis', "ai (j')"], ['tu', 'es', 'as'], ['il / elle / on', 'est', 'a'], ['nous', 'sommes', 'avons'], ['vous', 'êtes', 'avez'], ['ils / elles', 'sont', 'ont']], ['être', 'avoir']) },

add({ id: 'som-passos', g: 'som', title: 'Som do módulo: a linha na Trilha e os 3 passos', en: true, tags: ['novo', 'existe'], render(root){
  root.innerHTML = `<div class="mq-why">Linha própria na Trilha, depois da M1.7 e antes do Ponto de verificação, <b>opcional e sem bloquear</b> ${tag('novo')}. As telas de explicação reaproveitam as da gramática ${tag('existe')}; o botão 🐢 "ouvir devagar" já existe nos Desafios ${tag('ajuste')}.</div>
    <div class="mq-trail" style="margin-bottom:14px"><div class="mq-trail-row soft" style="cursor:default"><span class="mq-trail-num">🎧</span><span class="mq-trail-txt"><b>${L('Som do módulo: ritmo e entonação', 'Module sound: rhythm and intonation')}</b><span>${L('opcional · ~4 min · grátis', 'optional · ~4 min · free')}</span></span></div></div><div data-f></div>`;

const PIECES = [
  { k: 'cumprimento', en: 'greeting', re: /\b(bonjour|bonsoir|salut)\b/i, c: 'var(--seal-red)' },
  { k: 'nome', en: 'name', re: /je m'appelle\s+[\p{L}-]+|moi,? c'est\s+[\p{L}-]+/iu, c: 'var(--imperial-gold)' },
  { k: 'nacionalidade', en: 'nationality', re: /je suis (français|française|brésilien|brésilienne)\b/i, c: 'var(--jade)' },
  { k: 'idade', en: 'age', re: /j'ai\s+(\d+|[\p{L}]+(?:[-\s](?:et\s)?[\p{L}]+)*)\s+ans\b/iu, c: 'var(--brand-purple)' },
  { k: 'profissão', en: 'job', re: /je suis (?:un |une )?(professeure?|étudiante?|médecin|infirmière|infirmier|avocate?|vendeur|vendeuse|serveur|serveuse|ingénieure?)\b/i, c: 'var(--count-learning)' },

function paintPieces(text){
  let html = esc(text);
  PIECES.forEach(p => { const m = text.match(p.re); if (m){ const e = esc(m[0]); html = html.replace(e, `<span class="mq-pc" style="--pc:${p.c}" title="${p.k}">${e}</span>`); } });

}
function alerts(text){
  const out = [], f = PERSONA.fem, t = text.toLowerCase();
  if (/je suis\s+[\p{L}\d-]+(\s[\p{L}-]+)?\s+ans\b/iu.test(t)) out.push(L('<b>je suis ... ans</b> → para a idade, o francês usa avoir: <b>J\'ai ... ans.</b> (M1.3)', '<b>je suis ... ans</b> → for age, French uses avoir: <b>J\'ai ... ans.</b> (M1.3)'));
  if (/je suis (un|une) (professeur|étudiant|médecin|infirmi|avocat|vendeu|serveu|ingénieur)/i.test(t)){ const m = t.match(/je suis (un|une) [\p{L}]+/iu); out.push(L(`<b>${esc(m[0].replace(/^je suis /, ''))}</b> → profissão depois de je suis vai sem artigo. (M1.6)`, `<b>${esc(m[0].replace(/^je suis /, ''))}</b> → no article for a job after je suis. (M1.6)`)); }
  const pairs = { 'brésilien': 'brésilienne', 'français': 'française', 'infirmier': 'infirmière', 'vendeur': 'vendeuse', 'serveur': 'serveuse', 'avocat': 'avocate', 'étudiant': 'étudiante' };
  if (f){ const m = t.match(new RegExp('je suis (?:un |une )?(brésilien|français|infirmier|vendeur|serveur|avocat|étudiant)(?![\\p{L}])', 'iu')); if (m) out.push(L(`<b>${m[1]}</b> → a sua personagem é mulher: <b>${pairs[m[1]]}</b>. (M1.7)`, `<b>${m[1]}</b> → your character is a woman: <b>${pairs[m[1]]}</b>. (M1.7)`)); }
  else { const inv = Object.fromEntries(Object.entries(pairs).map(([a, b]) => [b, a])); const m = t.match(/je suis (?:un |une )?(brésilienne|française|infirmière|vendeuse|serveuse|avocate|étudiante)\b/i); if (m) out.push(L(`<b>${m[1]}</b> → o seu personagem é homem: <b>${inv[m[1]]}</b>. (M1.7)`, `<b>${m[1]}</b> → your character is a man: <b>${inv[m[1]]}</b>. (M1.7)`)); }
  return out;
}

  store('mq_screen', s.id);
}
function go(k){ APP.i = Math.max(0, Math.min(SCREENS.length - 1, k)); render(); window.scrollTo(0, 0); }
function goId(id){ const k = SCREENS.findIndex(s => s.id === id); if (k >= 0) go(k); }
function nextScreen(){ go(APP.i + 1); }

$('#mq-prev').addEventListener('click', () => go(APP.i - 1));
$('#mq-next').addEventListener('click', () => go(APP.i + 1));
$('#mq-menu-btn').addEventListener('click', () => { const n = $('#mq-nav'); n.classList.toggle('open'); $('#mq-menu-btn').setAttribute('aria-expanded', String(n.classList.contains('open'))); });
$('#mq-nav').addEventListener('click', e => { if (e.target.id === 'mq-nav') closeNav(); });
$('#mq-tags-btn').addEventListener('click', () => { APP.tags = !APP.tags; document.body.classList.toggle('tags-off', !APP.tags); $('#mq-tags-btn').setAttribute('aria-pressed', String(APP.tags)); store('mq_tags', APP.tags ? '1' : '0'); });
function setLang(l){ APP.lang = l; $('#mq-pt').setAttribute('aria-pressed', String(l === 'pt')); $('#mq-en').setAttribute('aria-pressed', String(l === 'en')); document.documentElement.lang = l === 'en' ? 'en' : 'pt-BR'; store('mq_lang', l); render(); }
$('#mq-pt').addEventListener('click', () => setLang('pt'));
$('#mq-en').addEventListener('click', () => setLang('en'));
function setTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  ['auto', 'light', 'dark'].forEach(x => $('#mq-th-' + x).setAttribute('aria-pressed', String(x === t)));
  store('mq_theme', t);
}
$('#mq-th-auto').addEventListener('click', () => setTheme('auto'));
$('#mq-th-light').addEventListener('click', () => setTheme('light'));
$('#mq-th-dark').addEventListener('click', () => setTheme('dark'));
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && SCREENS[APP.i].id !== id) goId(id); });

(function boot(){
  const th = load('mq_theme'); if (th === 'light' || th === 'dark') setTheme(th);
  if (load('mq_tags') === '0'){ APP.tags = false; document.body.classList.add('tags-off'); $('#mq-tags-btn').setAttribute('aria-pressed', 'false'); }
  if (load('mq_lang') === 'en'){ APP.lang = 'en'; $('#mq-pt').setAttribute('aria-pressed', 'false'); $('#mq-en').setAttribute('aria-pressed', 'true'); }
  const id = location.hash.slice(1) || load('mq_screen');
  const k = SCREENS.findIndex(s => s.id === id);
  APP.i = k >= 0 ? k : 0;
  render();
})();
</script>
</body>
</html>
