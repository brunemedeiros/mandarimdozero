<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Seu código para ativar a conta</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#FAF5EA;">
<!-- Modelo "Confirm sign up" do Supabase (docs/auth/confirmacao-por-codigo.md). Tabelas e estilos inline
     porque Gmail/Outlook ignoram CSS externo. Cores = tokens do site (fr): papel #FAF5EA, tinta #201335,
     azul #3498D6 / #1D5A82, rosa #E36BCA. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FAF5EA;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:0 0 20px;">
            <img src="https://app.profbrune.com.br/shared/brand/icon-192.png" width="56" height="56" alt="Prof. Brune"
              style="display:block;border:0;border-radius:14px;">
          </td>
        </tr>
        <tr>
          <td style="background:#FFFFFF;border:1px solid #E1D6C0;border-radius:18px;overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td height="6" style="height:6px;line-height:6px;font-size:0;background:#3498D6;background-image:linear-gradient(90deg,#3498D6,#E36BCA);">&nbsp;</td>
              </tr>
              <tr>
                <td style="padding:32px 32px 8px;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#201335;">
                  <p style="margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1D5A82;">Idiomas com Prof. Brune</p>
                  <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;font-weight:800;color:#201335;">Falta pouco!</h1>
                  <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#5C4E73;">Digite este código na tela de cadastro para ativar sua conta:</p>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 32px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background:#F0E8D8;border-radius:14px;">
                    <tr>
                      <td style="padding:16px 16px 16px 26px;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:34px;line-height:1;font-weight:800;letter-spacing:10px;color:#201335;">{{ .Token }}</td>
                    </tr>
                  </table>
                  <p style="margin:12px 0 0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;color:#5C4E73;">O código vale por 1 hora.</p>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:26px 32px 8px;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
                  <p style="margin:0 0 12px;font-size:14px;color:#5C4E73;">Ou, se preferir, toque no botão:</p>
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1D5A82;color:#FFFFFF;font-size:15px;font-weight:800;text-decoration:none;padding:13px 26px;border-radius:11px;">Ativar minha conta</a>
                </td>
              </tr>
              <tr>
                <td style="padding:26px 32px 30px;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
                  <p style="margin:0;padding-top:18px;border-top:1px solid #E1D6C0;font-size:13px;line-height:1.55;color:#5C4E73;">Se não foi você que criou a conta, é só ignorar este e-mail. Nada vai acontecer.</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 0 0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:800;">
            <span style="color:#3498D6;">@prof.</span><span style="color:#E36BCA;">brune</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
