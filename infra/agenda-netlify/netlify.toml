# agenda.profbrune.com.br -- link de agenda das aulas (migrations 103 e 107).
# Não guarda nada: cada pedido do Google Agenda/Apple/Outlook é repassado na hora para a Edge Function
# class-calendar-feed do Supabase (produção), que monta o .ics da pessoa dona da senha.
# Site do Netlify ligado ao repositório com "Base directory" = infra/agenda-netlify.

[build]
  publish = "."
  command = "echo sem build"
  # Só publica de novo quando ESTA pasta muda (o resto do repositório não dispara nada no Netlify).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Página inicial: leva para o site.
[[redirects]]
  from = "/"
  to = "https://app.profbrune.com.br/"
  status = 302
  force = true

# Volta do login do Google (app "Idiomas com Prof. Brune", migration 117): repasse para a Edge Function google-calendar.
# Assim o Google vê o domínio da Prof. Brune (exigido para verificar o app) em vez do endereço técnico do Supabase.
# Vem antes da regra da senha. A função usa este endereço como redirect_uri (secret GCAL_REDIRECT_URI na produção).
[[redirects]]
  from = "/google/callback"
  to = "https://eigjocalzwamisgqilhg.supabase.co/functions/v1/google-calendar/callback"
  status = 200
  force = true

# agenda.profbrune.com.br/<senha> -> Edge Function (status 200 = repasse; quem assina só vê o domínio da agenda).
[[redirects]]
  from = "/:token"
  to = "https://eigjocalzwamisgqilhg.supabase.co/functions/v1/class-calendar-feed/:token"
  status = 200
  force = true
