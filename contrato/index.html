<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Contrato · Prof. Brune</title>
<meta name="description" content="Formulário de dados para o contrato de aulas com a Prof. Brune.">
<meta name="theme-color" content="#3D167B">
<style>
  /* Moldura: o formulário mora no Google Apps Script e aparece aqui dentro,
     então o endereço app.profbrune.com.br/contrato fica na barra do navegador.
     Para mudar perguntas ou visual, atualize o Apps Script, não este arquivo. */
  html, body { margin: 0; height: 100%; background: #FAF5EA; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .fallback { position: fixed; inset: auto 0 0 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); font: 600 14px/1.4 system-ui, sans-serif; color: #221633; background: #FAF5EA; text-align: center; }
  .fallback a { color: #3D167B; font-weight: 800; }
</style>
</head>
<body>
<iframe id="app" title="Formulário do contrato" allow="clipboard-write"></iframe>
<noscript><p class="fallback">Ative o JavaScript para ver o formulário.</p></noscript>
<script>
  // Endereço /exec da implantação do Apps Script "Formulário do contrato".
  var EXEC = 'https://script.google.com/macros/s/AKfycbwEoV5EwatMJEnGRCBlrHN_bcxEVGw9FQhL2i1_nzWqmPXP1IzlzHgjEyDEYelpg9hTCQ/exec';
  var src = EXEC + (location.search || '');
  document.getElementById('app').src = src;
</script>
</body>
</html>
