<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de estilo do painel</title>
<!-- Página de documentação para quem desenvolve o painel (não faz parte do app do aluno). Texto fixo em português
     de propósito: não passa por t(). Cada componente é mostrado renderizado e com o HTML para copiar. -->
<link rel="stylesheet" href="../fonts/nunito.css">
<link rel="stylesheet" href="guia-paletas.css">
<link rel="stylesheet" href="vendor/pico.painel.css">
<link rel="stylesheet" href="painel-tokens.css">
<link rel="stylesheet" href="painel-componentes.css">
<style>
  html, body{ margin: 0; background: var(--paper); }
  .g-topo{ position: sticky; top: 0; z-index: 10; display: flex; gap: .75rem 1.5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: .75rem 1.5rem; background: var(--p-bg); border-bottom: 1px solid var(--p-linha); }
  .g-topo strong{ font-size: 1.05rem; }
  .g-controles{ display: flex; gap: .75rem; flex-wrap: wrap; }
  .g-corpo{ display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0; }
  .g-menu{ position: sticky; top: 3.9rem; align-self: start; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: .15rem; max-height: calc(100vh - 4rem); overflow-y: auto; }
  .g-menu a{ padding: .35rem .7rem; border-radius: 8px; text-decoration: none; color: var(--p-tinta-suave); font-weight: 700; font-size: .9rem; }
  .g-menu a:hover{ background: var(--p-linha); color: var(--p-tinta); }
  .g-sec{ display: flex; flex-direction: column; gap: 1rem; scroll-margin-top: 4.5rem; }
  .g-sec > h2{ margin: 0; font-size: 1.4rem; }
  .g-sec > p{ margin: 0; color: var(--p-tinta-suave); max-width: 70ch; }
  .g-exemplo > header{ display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .g-exemplo > header strong{ font-size: 1.02rem; }
  .g-origem{ font-size: .7rem; font-weight: 800; padding: .1rem .6rem; border-radius: 999px; border: 1px solid var(--p-linha); color: var(--p-tinta-suave); white-space: nowrap; }
  .g-origem--pico{ background: color-mix(in srgb, var(--p-ok) 18%, transparent); color: var(--p-tinta); border-color: color-mix(in srgb, var(--p-ok) 50%, transparent); }
  .g-uso{ margin: 0 0 .75rem; color: var(--p-tinta-suave); font-size: .9rem; }
  .g-palco{ padding: 1rem; border: 1px dashed var(--p-linha); border-radius: var(--p-raio-controle); background: var(--p-bg); overflow-x: auto; }
  .g-palco > *:last-child{ margin-bottom: 0; }
  .g-exemplo details{ margin: .75rem 0 0; }
  .g-exemplo pre{ margin: .5rem 0 0; max-height: 22rem; overflow: auto; font-size: .78rem; }
  .g-tokens{ display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .75rem; }
  .g-token{ display: grid; grid-template-columns: 2.6rem 1fr; gap: .6rem; align-items: center; padding: .55rem; border: 1px solid var(--p-linha); border-radius: var(--p-raio-controle); background: var(--p-elevado); }
  .g-token i{ width: 2.6rem; height: 2.6rem; border-radius: 8px; border: 1px solid var(--p-linha); display: block; }
  .g-token b{ display: block; font-size: .85rem; }
  .g-token small{ display: block; color: var(--p-tinta-suave); font-size: .72rem; line-height: 1.3; }
  .g-par{ display: flex; gap: .5rem; flex-wrap: wrap; }
  @media (max-width: 900px){ .g-corpo{ grid-template-columns: 1fr; } .g-menu{ position: static; flex-direction: row; flex-wrap: wrap; max-height: none; } }
</style>
</head>
<body>
<div class="painel" id="raiz">
  <div class="g-topo">
    <strong>Guia de estilo do painel</strong>
    <div class="g-controles">
      <div class="p-seg" id="curso" role="toolbar" aria-label="Curso">
        <button type="button" data-v="fr" aria-pressed="true">Francês</button>
        <button type="button" data-v="zh" aria-pressed="false">Mandarim</button>
      </div>
      <div class="p-seg" id="tema" role="toolbar" aria-label="Tema">
        <button type="button" data-v="light" aria-pressed="true">Claro</button>
        <button type="button" data-v="dark" aria-pressed="false">Escuro</button>
      </div>
    </div>
  </div>
  <div class="g-corpo">
    <nav class="g-menu" id="menu" aria-label="Seções"></nav>
    <main class="p-pagina" id="conteudo"></main>
  </div>
</div>

<script src="painel-ui.js"></script>

 {id:'paginacao', titulo:'Paginação', texto:'Navegar entre páginas de uma lista, com Anterior e Próxima. Do shadcn (Pagination). Só CSS.', ex:[
  {t:'Paginação no meio da lista', pico:false, uso:'A página atual leva aria-current="page". Reticências para páginas escondidas.', html:'<nav class="p-paginacao" aria-label="Páginas">\n  <ul>\n    <li><a href="#" class="p-pag-ant">Anterior</a></li>\n    <li><a href="#">1</a></li>\n    <li><a href="#">2</a></li>\n    <li><a href="#" aria-current="page">3</a></li>\n    <li><span class="p-pag-mais" aria-hidden="true">…</span></li>\n    <li><a href="#">9</a></li>\n    <li><a href="#" class="p-pag-prox">Próxima</a></li>\n  </ul>\n</nav>'},
  {t:'Na primeira página', pico:false, uso:'Anterior desabilitado com aria-disabled="true" (some o clique e fica apagado).', html:'<nav class="p-paginacao" aria-label="Páginas">\n  <ul>\n    <li><a href="#" class="p-pag-ant" aria-disabled="true">Anterior</a></li>\n    <li><a href="#" aria-current="page">1</a></li>\n    <li><a href="#">2</a></li>\n    <li><a href="#">3</a></li>\n    <li><a href="#" class="p-pag-prox">Próxima</a></li>\n  </ul>\n</nav>'}
 ]},
 {id:'menunav', titulo:'Menu de navegação', texto:'Barra de links com menus que abrem painéis de atalhos com descrição. Do shadcn (Navigation Menu). Usa details e o painel-ui.js: um painel aberto por vez, setas do teclado e Esc.', ex:[
  {t:'Menu com painéis', pico:false, livre:true, uso:'Cada item com painel é um details; um link simples usa a classe p-menunav-link. Setas esquerda e direita trocam de item, seta para baixo entra no painel.', html:'<nav class="p-menunav" aria-label="Principal">\n  <ul>\n    <li><details>\n      <summary>Professora</summary>\n      <div class="p-menunav-painel">\n        <a href="#"><strong>Alunos</strong><span>Quadro geral da turma e a ficha de cada aluno.</span></a>\n        <a href="#"><strong>Cartões</strong><span>Crie e acompanhe os cartões de estudo.</span></a>\n        <a href="#"><strong>Aulas</strong><span>Seu diário de aulas, só você vê.</span></a>\n        <a href="#"><strong>Material de apoio</strong><span>Arquivos e links para os alunos.</span></a>\n      </div>\n    </details></li>\n    <li><details>\n      <summary>Admin</summary>\n      <div class="p-menunav-painel">\n        <a href="#"><strong>Badges</strong><span>Selos especiais e métricas de uso.</span></a>\n        <a href="#"><strong>Analytics</strong><span>Como a plataforma está sendo usada.</span></a>\n        <a href="#"><strong>Notificações</strong><span>Regras e envios para os usuários.</span></a>\n        <a href="#"><strong>Planos</strong><span>Papéis, permissões e assinaturas.</span></a>\n      </div>\n    </details></li>\n    <li><a class="p-menunav-link" href="#">Ranking</a></li>\n  </ul>\n</nav>\n<div style="height:14rem"></div>'}
 ]},
 {id:'nativo', titulo:'Seleção nativa', texto:'O select do navegador, em pílula, mais arredondado que o do shadcn. A lista que abre é do navegador e do sistema, por isso funciona bem no celular.', ex:[
  {t:'Select nativo', pico:true, uso:'Use quando a lista é curta e simples, ou no celular. Para grupos, busca ou visual próprio, use a Seleção em lista.', html:'<label>Situação\n  <select>\n    <option>Selecione a situação</option>\n    <option>Em dia</option>\n    <option>Atenção</option>\n    <option>Parado</option>\n    <option>Arquivado</option>\n  </select>\n</label>'}
 ]},
 {id:'barramenus', titulo:'Barra de menus', texto:'Menus de ações no estilo de programa de computador (Arquivo, Exibir…). Do shadcn (Menubar). Com um menu aberto, passar o mouse nos outros troca de menu. Usa details e o painel-ui.js.', ex:[
  {t:'Barra com itens, atalhos e marcas', pico:false, livre:true, uso:'Itens de ação são botões com role="menuitem". Itens que ligam e desligam usam role="menuitemcheckbox" e aria-checked. p-menu-sep separa grupos, p-menu-atalho mostra o atalho.', html:'<div class="p-barramenus" role="menubar" aria-label="Cartões">\n  <details>\n    <summary>Arquivo</summary>\n    <div class="p-menu-lista" role="menu">\n      <button type="button" class="p-menu-item" role="menuitem">Novo cartão <span class="p-menu-atalho">Ctrl N</span></button>\n      <button type="button" class="p-menu-item" role="menuitem">Importar do Anki</button>\n      <div class="p-menu-sep" role="separator"></div>\n      <button type="button" class="p-menu-item" role="menuitem" aria-disabled="true">Exportar tudo</button>\n    </div>\n  </details>\n  <details>\n    <summary>Exibir</summary>\n    <div class="p-menu-lista" role="menu">\n      <button type="button" class="p-menu-item" role="menuitemcheckbox" aria-checked="false">Mostrar arquivados</button>\n      <button type="button" class="p-menu-item" role="menuitemcheckbox" aria-checked="true">Mostrar tags</button>\n      <div class="p-menu-sep" role="separator"></div>\n      <button type="button" class="p-menu-item" role="menuitem">Recarregar <span class="p-menu-atalho">Ctrl R</span></button>\n      <button type="button" class="p-menu-item" role="menuitem" aria-disabled="true">Forçar recarga <span class="p-menu-atalho">Ctrl Shift R</span></button>\n    </div>\n  </details>\n  <details>\n    <summary>Alunos</summary>\n    <div class="p-menu-lista" role="menu">\n      <span class="p-menu-rotulo">Mostrar cartões de</span>\n      <button type="button" class="p-menu-item" role="menuitem" aria-checked="true">Marina Alves</button>\n      <button type="button" class="p-menu-item" role="menuitem">Rafael Costa</button>\n    </div>\n  </details>\n</div>\n<div style="height:14rem"></div>'}
 ]},
 {id:'mensagens', titulo:'Mensagens', texto:'Balões de conversa. A pessoa que usa o painel fica à direita, em balão; a outra fica à esquerda, em texto solto. Do shadcn (Message).', ex:[
  {t:'Mensagens', pico:false, uso:'Cada mensagem tem corpo (um ou mais parágrafos) e uma linha pequena com autor e hora.', html:'<ul class="p-mensagens">\n  <li class="p-mensagem p-mensagem--recebida"><span class="p-avatar" aria-hidden="true">MA</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Oi, Brune! Não consegui fazer o exercício 5.</p></div><span class="p-mensagem-meta">Marina · 09:12</span></div></li>\n  <li class="p-mensagem p-mensagem--enviada"><span class="p-avatar" aria-hidden="true">BR</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Sem problema! Ele usa o passé composé com être.</p><p>Quer que eu explique na próxima aula?</p></div><span class="p-mensagem-meta">Você · 09:20</span></div></li>\n</ul>'}
 ]},
 {id:'conversa', titulo:'Rolagem de mensagens', texto:'Uma conversa com altura fixa que começa no fim, acompanha as mensagens novas e mostra um botão para voltar ao fim quando a pessoa subiu para ler. Do shadcn (Message Scroller). Usa o painel-ui.js.', ex:[
  {t:'Conversa com campo de envio', pico:false, uso:'Role para cima e envie uma mensagem: você não é arrastado para baixo, e o botão ↓ aparece. No fim da conversa, ela acompanha sozinha. Para adicionar mensagens pelo código: PainelUI.mensagem(lista, { texto, tipo, autor, hora }).', html:'<div class="p-conversa" style="max-width:34rem">\n  <div class="p-conversa-topo"><strong>Conversa com Marina Alves</strong><span>Francês A2</span></div>\n  <div class="p-conversa-rolagem" tabindex="0" aria-label="Mensagens">\n    <ul class="p-mensagens" id="conv-lista">\n      <li class="p-mensagem p-mensagem--recebida"><span class="p-avatar" aria-hidden="true">MA</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Oi, Brune! Não consegui fazer o exercício 5.</p></div><span class="p-mensagem-meta">Marina · 09:12</span></div></li>\n      <li class="p-mensagem p-mensagem--enviada"><span class="p-avatar" aria-hidden="true">BR</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Sem problema! Ele usa o passé composé com être.</p></div><span class="p-mensagem-meta">Você · 09:20</span></div></li>\n      <li class="p-mensagem p-mensagem--recebida"><span class="p-avatar" aria-hidden="true">MA</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Entendi! E o 6, posso fazer sem o livro?</p></div><span class="p-mensagem-meta">Marina · 09:24</span></div></li>\n      <li class="p-mensagem p-mensagem--enviada"><span class="p-avatar" aria-hidden="true">BR</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Pode sim. Se travar, me chame.</p></div><span class="p-mensagem-meta">Você · 09:25</span></div></li>\n      <li class="p-mensagem p-mensagem--recebida"><span class="p-avatar" aria-hidden="true">MA</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Combinado, obrigada.</p></div><span class="p-mensagem-meta">Marina · 09:26</span></div></li>\n      <li class="p-mensagem p-mensagem--enviada"><span class="p-avatar" aria-hidden="true">BR</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Na quinta revisamos o verbo aller.</p></div><span class="p-mensagem-meta">Você · 09:30</span></div></li>\n      <li class="p-mensagem p-mensagem--recebida"><span class="p-avatar" aria-hidden="true">MA</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Perfeito, até quinta!</p></div><span class="p-mensagem-meta">Marina · 09:31</span></div></li>\n      <li class="p-mensagem p-mensagem--enviada"><span class="p-avatar" aria-hidden="true">BR</span><div class="p-mensagem-bloco"><div class="p-mensagem-corpo"><p>Até lá!</p></div><span class="p-mensagem-meta">Você · 09:32</span></div></li>\n    </ul>\n  </div>\n  <button type="button" class="p-ir-ao-fim" aria-label="Ir para a mensagem mais recente">↓</button>\n  <form class="p-compositor">\n    <textarea rows="1" placeholder="Escreva uma mensagem" aria-label="Mensagem"></textarea>\n    <button type="button" id="conv-enviar">Enviar</button>\n  </form>\n</div>'}
 ]},
 {id:'rotulo', titulo:'Rótulo', texto:'O texto que nomeia um campo ou uma caixa. Do shadcn (Label). É o label do Pico: envolva o campo ou ligue com for e id.', ex:[
  {t:'Rótulo com caixa, rádio e campo', pico:true, uso:'Clicar no texto marca a caixa ou foca o campo. Para um formulário completo, com ajuda e erro, use o Campo (próximo exemplo).', html:'<label><input type="checkbox" checked> Aceito os termos e condições</label>\n<label><input type="radio" name="turma" checked> Turma de francês</label>\n<label for="u">Usuário</label>\n<input id="u" placeholder="@usuário">'}
 ]},
 {id:'campo', titulo:'Campo completo', texto:'Rótulo, controle, texto de ajuda e mensagem de erro juntos, em grupos com título, e campos lado a lado. Do shadcn (Field).', ex:[
  {t:'Grupo de campos', pico:false, uso:'p-grupo é o conjunto (fieldset com legend). p-campo une rótulo, controle e ajuda (p-ajuda) ou erro (p-erro, com p-campo--erro e aria-invalid). p-linha-campos coloca vários lado a lado.', html:'<fieldset class="p-grupo" style="max-width:30rem">\n  <legend>Vincular aluno</legend>\n  <p class="p-descricao">Informe a conta e o curso. O vínculo vale para um curso.</p>\n  <div class="p-campo">\n    <label for="f1">Usuário da conta</label>\n    <input id="f1" placeholder="@usuário">\n    <small class="p-ajuda">Peça o @ para a pessoa, em Perfil.</small>\n  </div>\n  <div class="p-campo p-campo--erro">\n    <label for="f2">E-mail de aviso</label>\n    <input id="f2" value="marina@" aria-invalid="true" aria-describedby="f2e">\n    <small class="p-erro" id="f2e">Falta o endereço completo do e-mail.</small>\n  </div>\n  <div class="p-linha-campos">\n    <div class="p-campo"><label for="f3">Curso</label><select id="f3"><option>Francês</option><option>Mandarim</option></select></div>\n    <div class="p-campo"><label for="f4">Nível</label><select id="f4"><option>A1</option><option>A2</option></select></div>\n    <div class="p-campo"><label for="f5">Aulas por semana</label><input id="f5" placeholder="2"></div>\n  </div>\n  <hr class="p-separador" style="margin:.2rem 0">\n  <label><input type="checkbox" checked> Avisar a pessoa por e-mail</label>\n  <div class="p-acoes"><button type="button">Vincular</button><button type="button" class="secondary">Cancelar</button></div>\n</fieldset>'}
 ]},
 {id:'item', titulo:'Item', texto:'Uma linha com ícone, título, descrição e uma ação, para listas de coisas. Do shadcn (Item).', ex:[
  {t:'Itens com ação, suave e como link', pico:false, uso:'p-item--suave tem fundo. Com a tag a, o item todo é um link e ganha uma seta. A ação (botão) fica em p-item-acoes.', html:'<ul class="p-itens" style="max-width:30rem">\n  <li><div class="p-item">\n    <div class="p-item-conteudo"><span class="p-item-titulo">Passé composé com être</span><span class="p-item-descricao">Aula de 09/10 com a Marina Alves.</span></div>\n    <div class="p-item-acoes"><button type="button" class="outline">Abrir</button></div>\n  </div></li>\n  <li><div class="p-item p-item--suave">\n    <span class="p-item-media" aria-hidden="true">✓</span>\n    <div class="p-item-conteudo"><span class="p-item-titulo">Seu perfil foi verificado.</span></div>\n  </div></li>\n  <li><a class="p-item" href="#">\n    <span class="p-item-media" aria-hidden="true">↓</span>\n    <div class="p-item-conteudo"><span class="p-item-titulo">Material de apoio</span><span class="p-item-descricao">3 arquivos para a turma do francês.</span></div>\n  </a></li>\n</ul>'}
 ]},
 {id:'grupo-entrada', titulo:'Campo com extras', texto:'Um campo com ícone, texto ou botão dentro da mesma borda. Do shadcn (Input Group).', ex:[
  {t:'Busca com contagem e campo com botão', pico:false, uso:'O contorno acende quando o campo está em foco. Ícone à esquerda, texto (p-adicional) ou botão à direita.', html:'<div class="p-grupo-entrada" style="max-width:24rem">\n  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>\n  <input type="search" placeholder="Buscar aluno…" aria-label="Buscar aluno">\n  <span class="p-adicional">12 resultados</span>\n</div>\n<p></p>\n<div class="p-grupo-entrada" style="max-width:24rem">\n  <span class="p-adicional">@</span>\n  <input placeholder="usuário" aria-label="Usuário">\n  <button type="button">Vincular</button>\n</div>'}
 ]},
 {id:'otp', titulo:'Código de dígitos', texto:'Uma caixa por dígito, para códigos como o de convite de aluno. Do shadcn (Input OTP). Usa o painel-ui.js: avança sozinho, Backspace volta, aceita colar o código inteiro.', ex:[
  {t:'Código de 6 dígitos', pico:false, uso:'O evento p-otp:completo traz o código quando todas as caixas estão preenchidas. data-tipo="texto" no p-otp aceita letras.', html:'<div class="p-otp" role="group" aria-label="Código de convite">\n  <input maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Dígito 1">\n  <input maxlength="1" inputmode="numeric" aria-label="Dígito 2">\n  <input maxlength="1" inputmode="numeric" aria-label="Dígito 3">\n  <span class="p-otp-sep" aria-hidden="true"></span>\n  <input maxlength="1" inputmode="numeric" aria-label="Dígito 4">\n  <input maxlength="1" inputmode="numeric" aria-label="Dígito 5">\n  <input maxlength="1" inputmode="numeric" aria-label="Dígito 6">\n</div>'}
 ]},
 {id:'campotexto', titulo:'Campo de texto', texto:'O campo de uma linha do formulário, com rótulo e texto de ajuda. Do shadcn (Input). É o input do Pico, dentro de um Campo.', ex:[
  {t:'Campo com ajuda', pico:true, uso:'Para vários campos juntos, com erro e agrupamento, veja Campo completo.', html:'<div class="p-campo" style="max-width:20rem">\n  <label for="api">Chave de acesso</label>\n  <input id="api" placeholder="sk-…">\n  <small class="p-ajuda">A chave é guardada de forma criptografada.</small>\n</div>'}
 ]},
 {id:'hover', titulo:'Cartão ao passar o mouse', texto:'Uma prévia de um nome ou link sem sair da tela. Abre ao passar o mouse e também ao focar com o teclado ou tocar. Do shadcn (Hover Card). Só CSS.', ex:[
  {t:'Prévia de uma aluna', pico:false, livre:true, uso:'p-hover envolve o link (p-hover-gatilho) e o corpo (p-hover-corpo). Não coloque nada essencial só aqui.', html:'<p>Aluna da semana:\n  <span class="p-hover">\n    <a href="#" class="p-hover-gatilho">@marina.alves</a>\n    <span class="p-hover-corpo" role="tooltip">\n      <span class="p-pessoa"><span class="p-avatar">MA</span><span><strong>Marina Alves</strong><small>Francês A2 · Módulo 4</small></span></span>\n      <span>Sequência de 23 dias e 91% de acerto nos últimos 7 dias.</span>\n      <small>Vinculada em 11/10/2026</small>\n    </span>\n  </span>\n</p>\n<div style="height:11rem"></div>'}
 ]},
 {id:'vazio-rico', titulo:'Estado vazio completo', texto:'Para quando não há nada ainda: ícone, título, explicação, ações e um link de ajuda. Do shadcn (Empty).', ex:[
  {t:'Vazio com ações', pico:false, uso:'Use p-vazio-icone, p-vazio-acoes e p-vazio-mais. Sempre ofereça o próximo passo.', html:'<article class="p-vazio">\n  <span class="p-vazio-icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></span>\n  <strong>Nenhum aluno vinculado ainda</strong>\n  <span>Você ainda não vinculou ninguém.<br>Comece vinculando a primeira pessoa.</span>\n  <div class="p-vazio-acoes"><button type="button">Vincular aluno</button><button type="button" class="outline">Importar lista</button></div>\n  <a class="p-vazio-mais" href="#">Saiba mais</a>\n</article>'}
 ]},
 {id:'menu-acoes', titulo:'Menu de ações', texto:'Uma lista de ações que abre sob um botão, com título de grupo, atalhos, itens desabilitados e item de risco. Do shadcn (Dropdown Menu). Usa details e o painel-ui.js.', ex:[
  {t:'Menu com grupos e atalhos', pico:false, livre:true, uso:'Itens são botões com role="menuitem". Esc, clique fora e as setas do teclado funcionam. p-menu-item--perigo deixa o item em vermelho. data-alinhar="fim" abre para a esquerda.', html:'<details class="p-menu">\n  <summary role="button" class="outline">Abrir</summary>\n  <div class="p-menu-lista" role="menu">\n    <span class="p-menu-rotulo">Minha conta</span>\n    <button type="button" class="p-menu-item" role="menuitem">Perfil <span class="p-menu-atalho">Ctrl P</span></button>\n    <button type="button" class="p-menu-item" role="menuitem">Assinatura <span class="p-menu-atalho">Ctrl B</span></button>\n    <button type="button" class="p-menu-item" role="menuitem">Configurações <span class="p-menu-atalho">Ctrl S</span></button>\n    <div class="p-menu-sep" role="separator"></div>\n    <button type="button" class="p-menu-item" role="menuitem">Convidar alunos</button>\n    <button type="button" class="p-menu-item" role="menuitem" aria-disabled="true">API</button>\n    <div class="p-menu-sep" role="separator"></div>\n    <button type="button" class="p-menu-item p-menu-item--perigo" role="menuitem">Sair <span class="p-menu-atalho">Ctrl Q</span></button>\n  </div>\n</details>\n<div style="height:16rem"></div>'}
 ]},
 {id:'tecla', titulo:'Tecla', texto:'Mostra uma tecla ou um atalho dentro do texto. Do shadcn (Kbd). Só CSS.', ex:[
  {t:'Teclas e atalhos', pico:true, uso:'kbd para uma tecla. p-teclas junta várias numa combinação.', html:'<p>Pressione <span class="p-teclas"><kbd>Ctrl</kbd><kbd>K</kbd></span> para buscar um aluno,\nou <kbd>Esc</kbd> para fechar.</p>\n<p><kbd>⌘</kbd> <kbd>⇧</kbd> <kbd>P</kbd></p>'}
 ]},
 {id:'dialogo', titulo:'Janela de diálogo', texto:'Uma janela que abre por cima da tela e prende o foco até fechar. Do shadcn (Dialog). Usa o dialog do navegador e o painel-ui.js.', ex:[
  {t:'Janela com formulário', pico:true, uso:'data-abrir-dialogo abre, data-fechar-dialogo e o X fecham. Esc e o clique no fundo também. Use class="p-dialogo" no dialog.', html:'<button type="button" data-abrir-dialogo="dlg-perfil">Editar perfil</button>\n<dialog id="dlg-perfil" class="p-dialogo" aria-labelledby="dlg-titulo">\n  <article>\n    <header>\n      <button type="button" aria-label="Fechar" rel="prev"></button>\n      <h3 id="dlg-titulo">Editar perfil</h3>\n      <p>Altere os dados da aluna. Clique em salvar quando terminar.</p>\n    </header>\n    <div class="p-campo"><label for="dn">Nome</label><input id="dn" value="Marina Alves"></div>\n    <div class="p-campo"><label for="du">Usuário</label><input id="du" value="@marina.alves"></div>\n    <footer>\n      <button type="button" class="secondary" data-fechar-dialogo>Cancelar</button>\n      <button type="button" data-fechar-dialogo>Salvar alterações</button>\n    </footer>\n  </article>\n</dialog>'}
 ]},
 {id:'data', titulo:'Escolher data', texto:'Um botão que abre um calendário em português para escolher o dia. Do shadcn (Date Picker). Usa o painel-ui.js. Para um campo simples, o input type="date" do navegador também funciona.', ex:[
  {t:'Calendário', pico:false, livre:true, uso:'Setas do teclado andam entre os dias, PageUp e PageDown trocam de mês, Esc fecha. O valor fica no data-valor e no input escondido, em AAAA-MM-DD. O evento p-data:escolheu avisa a tela.', html:'<details class="p-popover p-data">\n  <summary role="button" class="outline" data-vazio>Escolha uma data</summary>\n  <div class="p-popover-corpo p-calendario" role="dialog" aria-label="Calendário"></div>\n  <input type="hidden" name="data-aula">\n</details>\n<div style="height:21rem"></div>'}
 ]},
 {id:'contexto', titulo:'Menu de contexto', texto:'Um menu de ações que abre onde a pessoa clicou com o botão direito. Do shadcn (Context Menu). Usa o painel-ui.js. No celular não existe botão direito: ofereça também o Menu de ações.', ex:[
  {t:'Menu com o botão direito', pico:false, uso:'Marque a área com data-menu-contexto="id do menu". A tecla de menu do teclado também abre. Esc, clique fora e rolar a página fecham.', html:'<div class="p-contexto-area" data-menu-contexto="ctx1" tabindex="0">Clique com o botão direito aqui</div>\n<div class="p-menu-lista p-contexto-menu" id="ctx1" role="menu" hidden>\n  <button type="button" class="p-menu-item" role="menuitem">Voltar <span class="p-menu-atalho">Ctrl [</span></button>\n  <button type="button" class="p-menu-item" role="menuitem" aria-disabled="true">Avançar <span class="p-menu-atalho">Ctrl ]</span></button>\n  <button type="button" class="p-menu-item" role="menuitem">Recarregar <span class="p-menu-atalho">Ctrl R</span></button>\n  <div class="p-menu-sep" role="separator"></div>\n  <button type="button" class="p-menu-item" role="menuitemcheckbox" aria-checked="true">Mostrar favoritos</button>\n  <button type="button" class="p-menu-item" role="menuitemcheckbox" aria-checked="false">Mostrar endereços completos</button>\n  <div class="p-menu-sep" role="separator"></div>\n  <span class="p-menu-rotulo">Alunos</span>\n  <button type="button" class="p-menu-item" role="menuitem" aria-checked="true">Marina Alves</button>\n  <button type="button" class="p-menu-item" role="menuitem">Rafael Costa</button>\n</div>'}
 ]},
 {id:'combo', titulo:'Combobox', texto:'Um campo em que a pessoa digita para filtrar a lista e escolhe uma opção. Do shadcn (Combobox). Ignora acentos e maiúsculas. Usa o painel-ui.js.', ex:[
  {t:'Escolher um aluno com busca', pico:false, livre:true, uso:'Digite joao para achar João. Setas navegam, Enter escolhe, Esc volta ao que estava escolhido. O evento p-combo:escolheu traz valor e rótulo.', html:'<div class="p-combo">\n  <div class="p-grupo-entrada">\n    <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cb-lista" placeholder="Escolha um aluno…" aria-label="Aluno" autocomplete="off">\n  </div>\n  <ul class="p-combo-lista" id="cb-lista" role="listbox" hidden>\n    <li role="option" data-valor="marina">Marina Alves</li>\n    <li role="option" data-valor="rafael">Rafael Costa</li>\n    <li role="option" data-valor="helena">Helena Duarte</li>\n    <li role="option" data-valor="tiago">Tiago Nunes</li>\n    <li role="option" data-valor="camila">Camila Ferraz</li>\n    <li role="option" data-valor="joao">João Pedro Lima</li>\n    <li class="p-combo-vazio" role="presentation" hidden>Nenhum aluno encontrado.</li>\n  </ul>\n</div>\n<div style="height:15rem"></div>'}
 ]},
 {id:'colapsavel', titulo:'Bloco que abre e fecha', texto:'Mostra o essencial e esconde o detalhe atrás de um botão. Do shadcn (Collapsible). Usa o painel-ui.js.', ex:[
  {t:'Detalhes sob demanda', pico:false, uso:'O botão leva aria-controls com o id do corpo e aria-expanded. O resumo fica sempre visível, o resto abre ao clicar.', html:'<div class="p-colapsavel">\n  <div class="p-colapsavel-topo">\n    <strong>Aula de 09/10</strong>\n    <button type="button" class="outline p-colapsavel-botao" aria-expanded="false" aria-controls="col-detalhes" aria-label="Mostrar detalhes">\n      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>\n    </button>\n  </div>\n  <div class="p-linha-info"><span>Aluna</span><span>Marina Alves</span></div>\n  <div class="p-colapsavel-corpo" id="col-detalhes" hidden>\n    <div class="p-linha-info"><span>Lição de casa</span><span>Exercícios 4 e 5</span></div>\n    <div class="p-linha-info"><span>Observações</span><span>Confunde avoir e être</span></div>\n  </div>\n</div>'}
 ]},
 {id:'balao', titulo:'Balão de mensagem', texto:'Texto de conversa em balões, agrupados por quem fala. Do shadcn (Bubble). Para a conversa completa com rolagem e campo de envio, veja Mensagens.', ex:[
  {t:'Balões e reação', pico:false, uso:'Mensagens seguidas da mesma pessoa formam um grupo: só o último balão tem o canto reto. A reação fica sobre a borda do balão.', html:'<ul class="p-balaos" style="max-width:30rem">\n  <li class="p-balao-grupo p-balao-grupo--recebida">\n    <p class="p-balao p-balao--recebida">Oi, professora! Posso mandar o áudio da lição 4?</p>\n    <p class="p-balao p-balao--recebida">É rapidinho.</p>\n  </li>\n  <li class="p-balao-grupo p-balao-grupo--enviada">\n    <p class="p-balao p-balao--enviada">Claro! Manda por aqui mesmo.</p>\n    <span class="p-reacoes" aria-label="1 reação de coração">❤️ <small>1</small></span>\n  </li>\n</ul>'}
 ]},
 {id:'anexo', titulo:'Anexo', texto:'Arquivo, imagem ou envio em andamento, com remoção animada. Do shadcn (Attachment). Usa o painel-ui.js.', ex:[
  {t:'Arquivos e envio com progresso', pico:false, uso:'Pelo código: var a = PainelUI.anexo(lista, { nome, progresso: 0 }); a.progresso(60); a.concluir("2,4 MB") ou a.falhar("mensagem"). O X anima a saída. Com movimento reduzido, tudo aparece e some sem animação.', html:'<ul class="p-anexos" id="anx-lista" style="max-width:30rem">\n  <li class="p-anexo">\n    <span class="p-anexo-media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>\n    <span class="p-anexo-texto"><span class="p-anexo-nome">lista-de-vocabulario.pdf</span><span class="p-anexo-detalhe">2,4 MB</span></span>\n    <button type="button" class="p-anexo-remover" aria-label="Remover lista-de-vocabulario.pdf">×</button>\n  </li>\n  <li class="p-anexo p-anexo--enviando" aria-busy="true">\n    <span class="p-anexo-media"><span class="p-spinner" aria-hidden="true"></span></span>\n    <span class="p-anexo-texto"><span class="p-anexo-nome">audio-licao-4.mp3</span><span class="p-anexo-detalhe">Enviando · 60%</span></span>\n    <button type="button" class="p-anexo-remover" aria-label="Remover audio-licao-4.mp3">×</button>\n    <span class="p-anexo-barra"><i style="--v:60%"></i></span>\n  </li>\n  <li class="p-anexo p-anexo--erro">\n    <span class="p-anexo-media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>\n    <span class="p-anexo-texto"><span class="p-anexo-nome">video-aula.mov</span><span class="p-anexo-detalhe">Arquivo grande demais (máximo 50 MB)</span></span>\n    <button type="button" class="p-anexo-remover" aria-label="Remover video-aula.mov">×</button>\n  </li>\n</ul>\n<p></p>\n<button type="button" class="outline" id="anx-demo">Simular um envio</button>'}
 ]},
 {id:'alertdialog', titulo:'Confirmação', texto:'Janela que exige uma resposta antes de seguir, para ações que apagam ou removem. Do shadcn (Alert Dialog). Diferente da Janela de diálogo: sem X e o clique no fundo não fecha. Cancelar recebe o foco, para um Enter sem querer não apagar nada.', ex:[
  {t:'Confirmar antes de remover', pico:false, uso:'Pelo código: PainelUI.confirmar({ titulo, descricao, confirmar, perigo: true }) devolve uma promessa com true ou false.', html:'<button type="button" class="p-perigo" data-abrir-dialogo="dlg-alerta">Remover aluno</button>\n<button type="button" class="outline" id="conf-demo">Abrir pelo código</button>\n<dialog id="dlg-alerta" class="p-dialogo p-dialogo--alerta" role="alertdialog" aria-labelledby="dlg-alerta-t" aria-describedby="dlg-alerta-d">\n  <article>\n    <header>\n      <h3 id="dlg-alerta-t">Remover Marina Alves?</h3>\n      <p id="dlg-alerta-d">Ela perde o acesso ao seu material. O progresso de estudo dela é mantido.</p>\n    </header>\n    <footer>\n      <button type="button" class="secondary" data-fechar-dialogo data-foco-inicial>Cancelar</button>\n      <button type="button" class="p-perigo" data-fechar-dialogo>Remover</button>\n    </footer>\n  </article>\n</dialog>'}
 ]},
 {id:'alerta', titulo:'Alerta em caixa', texto:'Aviso fixo na página com ícone, título e descrição. Do shadcn (Alert). Para avisos que somem sozinhos use o Aviso temporário.', ex:[
  {t:'Sucesso, informação e erro', pico:false, uso:'Use role="alert" só para erro. A cor do ícone nunca é a única pista: o título diz o que aconteceu.', html:'<div class="p-pagina" style="padding:0;display:grid;gap:.75rem;max-width:34rem">\n  <div class="p-alerta p-alerta--caixa p-alerta--ok" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><div><strong>Cartões publicados</strong><span>Os 12 cartões já aparecem para os alunos de Francês A2.</span></div></div>\n  <div class="p-alerta p-alerta--caixa" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div><strong>Novo recurso</strong><span>Agora você pode anexar áudios nas mensagens.</span></div></div>\n  <div class="p-alerta p-alerta--caixa p-alerta--erro" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg><div><strong>Não foi possível salvar</strong><span>Confira sua conexão e tente de novo.</span></div></div>\n</div>'}
 ]},
 {id:'selos', titulo:'Selos de situação', texto:'Mostram o estado em uma palavra. A cor nunca é a única pista: o texto sempre diz.', ex:[
  {t:'Selos', pico:false, uso:'Em dia, atenção, parado, informação e neutro.', html:
'<span class="p-selo p-selo--ok">Em dia</span>\n<span class="p-selo p-selo--aviso">Atenção</span>\n<span class="p-selo p-selo--erro">Parado</span>\n<span class="p-selo p-selo--info">Novo</span>\n<span class="p-selo">Rascunho</span>'}
 ]},
 {id:'alertas', titulo:'Alertas', texto:'Avisos que aparecem no topo da tela ou do bloco. Opcionalmente trazem uma ação.', ex:[
  {t:'Quatro tons', pico:false, uso:'Aviso é o padrão. Use ok, erro e info quando o assunto pedir.', html:
'<div class="p-pagina" style="padding:0">\n  <div class="p-alerta p-alerta--ok"><span>Cartões salvos com sucesso.</span></div>\n  <div class="p-alerta"><span><strong>3 alunos</strong> estão há mais de 7 dias sem estudar.</span><button style="padding:.3rem .8rem">Enviar lembrete</button></div>\n  <div class="p-alerta p-alerta--erro"><span>Não foi possível salvar. Tente de novo.</span></div>\n  <div class="p-alerta p-alerta--info"><span>Novo módulo disponível no francês A2.</span></div>\n</div>'}
 ]},
 {id:'abas', titulo:'Abas', texto:'Separam partes de uma mesma tela. A aba atual leva aria-current.', ex:[
  {t:'Abas', pico:false, uso:'Para dividir um bloco ou a navegação entre Professora e Admin.', html:
'<nav class="p-abas" aria-label="Seções do aluno">\n  <a href="#" aria-current="page">Resumo</a>\n  <a href="#">Cartões</a>\n  <a href="#">Aulas</a>\n  <a href="#">Atividade</a>\n</nav>'}
 ]},
 {id:'avatar', titulo:'Avatar e pessoa', texto:'Iniciais em um círculo, com nome e usuário ao lado.', ex:[
  {t:'Avatar e linha de pessoa', pico:false, uso:'Em tabelas e cabeçalhos de aluno.', html:
'<div class="p-pessoa">\n  <span class="p-avatar">MA</span>\n  <div><strong>Marina Alves</strong><small>@marina.alves</small></div>\n</div>\n<p></p>\n<div class="p-pessoa">\n  <span class="p-avatar p-avatar--grande">CF</span>\n  <div><strong>Camila Ferraz</strong><small>@cafer · Francês A2</small></div>\n</div>'}
 ]},
 {id:'blocos', titulo:'Blocos, indicadores e progresso', texto:'Bloco é o cartão do Pico com título no topo. Indicador é o número grande para ver o quadro geral de relance.', ex:[
  {t:'Bloco', pico:true, uso:'Agrupa informação de um mesmo assunto. Título em header, ações em footer.', html:
'<article>\n  <header><h3>Anotação da professora</h3></header>\n  <label>Lembrete para a próxima aula\n    <textarea rows="3"></textarea>\n  </label>\n  <footer><button>Salvar anotação</button></footer>\n</article>'},
  {t:'Faixa de resumo', pico:false, uso:'No topo da tela, antes do detalhe. Quatro indicadores é o ideal.', html:
'<div class="p-resumo">\n  <article class="p-indicador"><span class="p-indicador-rotulo">Alunos ativos</span><span class="p-indicador-valor">18</span><span class="p-indicador-detalhe">2 novos este mês</span></article>\n  <article class="p-indicador"><span class="p-indicador-rotulo">Estudaram hoje</span><span class="p-indicador-valor">11</span><span class="p-indicador-detalhe">61% da turma</span></article>\n  <article class="p-indicador"><span class="p-indicador-rotulo">Cartões vencidos</span><span class="p-indicador-valor">142</span><span class="p-indicador-detalhe">média de 8 por aluno</span></article>\n  <article class="p-indicador"><span class="p-indicador-rotulo">Parados há 7+ dias</span><span class="p-indicador-valor">3</span><span class="p-indicador-detalhe">precisam de atenção</span></article>\n</div>'},
  {t:'Barra de progresso', pico:true, uso:'Sempre com o número ao lado ou no rótulo.', html:
'<label>Retenção (91%)\n  <progress value="91" max="100"></progress>\n</label>\n<label>Meta da semana (62%)\n  <progress value="62" max="100"></progress>\n</label>'}
 ]},
 {id:'tabelas', titulo:'Tabelas e listas', texto:'Tabela para comparar vários alunos. Lista para poucos itens com uma ação.', ex:[
  {t:'Tabela', pico:true, uso:'Dentro de p-tabela, para rolar de lado só ela, nunca a página. A primeira coluna (a pessoa) fica à esquerda; os demais dados e títulos ficam centralizados.', html:
'<article class="p-tabela">\n  <table class="striped">\n    <thead><tr><th>Aluno</th><th>Nível</th><th>Atividade</th><th>Retenção</th><th>Situação</th></tr></thead>\n    <tbody>\n      <tr><td><div class="p-pessoa"><span class="p-avatar">MA</span><div><strong>Marina Alves</strong><small>@marina.alves</small></div></div></td><td>A2</td><td>hoje</td><td>91%</td><td><span class="p-selo p-selo--ok">Em dia</span></td></tr>\n      <tr><td><div class="p-pessoa"><span class="p-avatar">HD</span><div><strong>Helena Duarte</strong><small>@helena.d</small></div></div></td><td>B1</td><td>há 9 dias</td><td>72%</td><td><span class="p-selo p-selo--erro">Parado</span></td></tr>\n    </tbody>\n  </table>\n</article>'},
  {t:'Lista com selo', pico:false, uso:'Para atividade recente e itens curtos.', html:
'<article>\n  <header><h3>Atividade recente</h3></header>\n  <ul class="p-lista">\n    <li><span>Hoje · 48 cartões revisados</span><span class="p-selo p-selo--ok">Em dia</span></li>\n    <li><span>Ontem · Ditado do módulo 4</span><span class="p-selo p-selo--info">Acertou 8 de 10</span></li>\n    <li><span>Há 5 dias · Ouça e traduza</span><span class="p-selo p-selo--aviso">Acertou 5 de 10</span></li>\n  </ul>\n</article>'}
 ]},
 {id:'janelas', titulo:'Janela, menu e acordeão', texto:'Para confirmações, ações escondidas e conteúdo que o leitor abre quando quer.', ex:[
  {t:'Janela de confirmação', pico:true, uso:'Na tela real vai dentro de dialog com o atributo open. Aqui aparece fixa para mostrar o visual.', html:
'<article style="max-width:440px">\n  <header><strong>Remover o vínculo com a aluna?</strong></header>\n  <p>O progresso dela continua guardado. Você pode vincular de novo depois.</p>\n  <footer class="p-acoes" style="justify-content:flex-end">\n    <button class="secondary">Cancelar</button>\n    <button>Remover</button>\n  </footer>\n</article>'},
  {t:'Menu suspenso e acordeão', pico:true, uso:'Sem JavaScript: usam a tag details.', html:
'<details class="dropdown">\n  <summary>Mais ações</summary>\n  <ul>\n    <li><a href="#">Enviar mensagem</a></li>\n    <li><a href="#">Exportar cartões</a></li>\n    <li><a href="#">Remover vínculo</a></li>\n  </ul>\n</details>\n<details>\n  <summary>Como a retenção é calculada?</summary>\n  <p>É a porcentagem de cartões respondidos corretamente nos últimos 30 dias.</p>\n</details>'}
 ]},
 {id:'vazio', titulo:'Estado vazio', texto:'Quando não há nada para mostrar, a tela explica e sugere o próximo passo.', ex:[
  {t:'Estado vazio', pico:false, uso:'Nunca deixe um bloco em branco.', html:
'<article class="p-vazio">\n  <strong>Nenhuma aluna vinculada ainda</strong>\n  <span>Convide uma pessoa pelo @usuário para ver o progresso dela aqui.</span>\n  <button>Convidar aluna</button>\n</article>'}
 ]},
 {id:'padroes', titulo:'Padrões de página', texto:'A mesma estrutura em toda tela: cabeçalho, alerta se houver, faixa de resumo, ferramentas e blocos. Isso é o que dá o ar de uma família só.', ex:[
  {t:'Tela de lista: Alunos', pico:false, uso:'Quadro geral da turma.', html:
'<div class="p-pagina" style="padding:0">\n  <header class="p-cabecalho">\n    <div><span class="p-sobretitulo">Painel da professora</span><h1>Alunos de Francês</h1><span class="p-subtitulo">18 alunos ativos</span></div>\n    <div class="p-acoes"><button class="outline">Exportar lista</button><button>Convidar aluno</button></div>\n  </header>\n  <div class="p-alerta"><span><strong>3 alunos</strong> estão há mais de 7 dias sem estudar.</span><button style="padding:.3rem .8rem">Enviar lembrete</button></div>\n  <div class="p-resumo">\n    <article class="p-indicador"><span class="p-indicador-rotulo">Alunos ativos</span><span class="p-indicador-valor">18</span><span class="p-indicador-detalhe">2 novos este mês</span></article>\n    <article class="p-indicador"><span class="p-indicador-rotulo">Estudaram hoje</span><span class="p-indicador-valor">11</span><span class="p-indicador-detalhe">61% da turma</span></article>\n    <article class="p-indicador"><span class="p-indicador-rotulo">Parados há 7+ dias</span><span class="p-indicador-valor">3</span><span class="p-indicador-detalhe">precisam de atenção</span></article>\n  </div>\n  <div class="p-ferramentas"><input class="p-cresce" type="search" placeholder="Buscar por nome ou @usuário" aria-label="Buscar aluno"><label><input type="checkbox" role="switch"> Só quem precisa de atenção</label></div>\n  <article class="p-tabela"><table class="striped"><thead><tr><th>Aluno</th><th>Nível</th><th>Atividade</th><th>Situação</th></tr></thead><tbody>\n    <tr><td><div class="p-pessoa"><span class="p-avatar">MA</span><div><strong>Marina Alves</strong><small>@marina.alves</small></div></div></td><td>A2</td><td>hoje</td><td><span class="p-selo p-selo--ok">Em dia</span></td></tr>\n    <tr><td><div class="p-pessoa"><span class="p-avatar">TN</span><div><strong>Tiago Nunes</strong><small>@tiagonunes</small></div></div></td><td>A1</td><td>há 3 dias</td><td><span class="p-selo p-selo--aviso">Atenção</span></td></tr>\n  </tbody></table></article>\n</div>'},
  {t:'Tela de detalhe: Aluno', pico:false, uso:'Visão individual. A gamificação do aluno aparece só como dado (números), sem peças de jogo.', html:

/* ---------- Montagem ---------- */
var raiz = document.getElementById('raiz');
var html = document.documentElement;

function criar(tag, cls, texto){ var e = document.createElement(tag); if(cls) e.className = cls; if(texto != null) e.textContent = texto; return e; }

function montar(){
  var menu = document.getElementById('menu'), conteudo = document.getElementById('conteudo');
  var cab = criar('header','p-cabecalho');
  var cab1 = criar('div'); cab1.appendChild(criar('span','p-sobretitulo','Design System')); cab1.appendChild(criar('h1',null,'Guia de estilo do painel'));
  cab1.appendChild(criar('span','p-subtitulo','Pico CSS limitado ao painel, mais os tokens e componentes da Brune. Troque curso e tema no topo para conferir.'));
  cab.appendChild(cab1); conteudo.appendChild(cab);
  SECOES.forEach(function(s){
    var a = criar('a',null,s.titulo); a.href = '#'+s.id; menu.appendChild(a);
    var sec = criar('section','g-sec'); sec.id = s.id;
    sec.appendChild(criar('h2',null,s.titulo)); sec.appendChild(criar('p',null,s.texto));
    if(s.tokens){ var g = criar('div','g-tokens'); g.id = 'tokens'; sec.appendChild(g); }
    s.ex.forEach(function(ex){
      var art = criar('article','g-exemplo');
      var h = criar('header'); h.appendChild(criar('strong',null,ex.t));
      h.appendChild(criar('span','g-origem'+(ex.pico?' g-origem--pico':''), ex.so_codigo?'Instrução':(ex.pico?'Nativo do Pico':'Feito à mão')));
      art.appendChild(h);
      art.appendChild(criar('p','g-uso',ex.uso));
      if(!ex.so_codigo){ var palco = criar('div','g-palco'); if(ex.livre) palco.style.overflow = 'visible'; palco.innerHTML = ex.html; art.appendChild(palco); }
      var det = criar('details'); det.appendChild(criar('summary',null,'Ver o HTML'));
      var pre = criar('pre'); pre.appendChild(criar('code',null,ex.html)); det.appendChild(pre); art.appendChild(det);
      sec.appendChild(art);
    });
    conteudo.appendChild(sec);
  });
  conteudo.appendChild(criar('p','p-subtitulo','Dados de exemplo. Nada aqui lê ou grava no Supabase.'));
}

function hex(rgb){ var m = rgb.match(/\d+(\.\d+)?/g); if(!m) return rgb; return '#'+m.slice(0,3).map(function(n){ return ('0'+Math.round(+n).toString(16)).slice(-2); }).join('').toUpperCase(); }
function pintarTokens(){
  var g = document.getElementById('tokens'); if(!g) return; g.textContent = '';
  TOKENS.forEach(function(t){
    var c = criar('div','g-token'); var i = criar('i'); i.style.background = 'var('+t[0]+')'; c.appendChild(i);
    var d = criar('div'); var b = criar('b',null,t[0]); var s1 = criar('small',null,t[1]); var s2 = criar('small',null,'vem de '+t[2]);
    var s3 = criar('small',null,hex(getComputedStyle(i).backgroundColor)); d.appendChild(b); d.appendChild(s1); d.appendChild(s2); d.appendChild(s3); c.appendChild(d); g.appendChild(c);
  });
}
function aplicar(curso, tema){
  html.setAttribute('data-curso', curso); html.setAttribute('data-theme', tema);
  document.querySelectorAll('#curso button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === curso)); });
  document.querySelectorAll('#tema button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === tema)); });
  pintarTokens();
  try{ localStorage.setItem('guia-painel', JSON.stringify({curso:curso, tema:tema})); }catch(e){}
}
var estado = {curso:'fr', tema: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'};
try{ var sv = JSON.parse(localStorage.getItem('guia-painel')||'{}'); if(sv.curso) estado.curso = sv.curso; if(sv.tema) estado.tema = sv.tema; }catch(e){}
montar();
(function ligarConversa(){
  var env = document.getElementById('conv-enviar'); if(!env || !window.PainelUI) return;
  env.addEventListener('click', function(){
    var ta = env.closest('form').querySelector('textarea'), txt = ta.value.trim(); if(!txt) return;
    PainelUI.mensagem(document.getElementById('conv-lista'), { texto: txt, tipo: 'enviada', autor: 'Você', hora: 'agora' }); ta.value = '';
  });
})();
(function ligarNovas(){
  if(!window.PainelUI) return;
  var c = document.getElementById('conf-demo');
  if(c) c.addEventListener('click', function(){
    PainelUI.confirmar({ titulo:'Apagar 12 cartões?', descricao:'Isso não pode ser desfeito.', confirmar:'Apagar', perigo:true }).then(function(ok){
      PainelUI.toast({ titulo: ok ? 'Cartões apagados' : 'Nada foi apagado' });
    });
  });
  var d = document.getElementById('anx-demo');
  if(d) d.addEventListener('click', function(){
    var lista = document.getElementById('anx-lista'), a = PainelUI.anexo(lista, { nome:'licao-5.pdf', progresso:0 }), v = 0;
    var t = setInterval(function(){ v += 12; a.progresso(v); if(v >= 100){ clearInterval(t); a.concluir('1,1 MB'); } }, 250);
  });
})();
aplicar(estado.curso, estado.tema);
document.getElementById('curso').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ estado.curso = b.getAttribute('data-v'); aplicar(estado.curso, estado.tema); } });
document.getElementById('tema').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ estado.tema = b.getAttribute('data-v'); aplicar(estado.curso, estado.tema); } });
