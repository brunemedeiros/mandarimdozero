<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de estilo do painel</title>
<!-- Página de documentação para quem desenvolve o painel (não faz parte do app do aluno). Texto fixo em português
     de propósito: não passa por t(). Cada componente é mostrado renderizado e com o HTML para copiar. -->
<link rel="stylesheet" href="guia-paletas.css">
<link rel="stylesheet" href="vendor/pico.painel.css">
<link rel="stylesheet" href="painel-tokens.css">
<link rel="stylesheet" href="painel-componentes.css">
<style>
  html, body{ margin: 0; background: var(--paper); }
  .g-topo{ position: sticky; top: 0; z-index: 10; display: flex; gap: .75rem 1.5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: .75rem 1.5rem; background: var(--p-bg); border-bottom: 1px solid var(--p-linha); }
  .g-topo strong{ font-size: 1.05rem; }
  .g-controles{ display: flex; gap: .75rem; flex-wrap: wrap; }
  .g-seg{ display: inline-flex; gap: .25rem; padding: .25rem; background: var(--p-superficie); border: 1px solid var(--p-linha); border-radius: 12px; }
  .painel .g-seg button{ margin: 0; width: auto; padding: .4rem .9rem; background: transparent; border-color: transparent; color: var(--p-tinta-suave); font-weight: 700; min-height: 2.5rem; }
  .painel .g-seg button[aria-pressed="true"]{ background: var(--p-marca); border-color: var(--p-marca); color: var(--p-sobre-marca); }
  .g-corpo{ display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0; }
  .g-menu{ position: sticky; top: 3.9rem; align-self: start; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: .15rem; max-height: calc(100vh - 4rem); overflow-y: auto; }
  .g-menu a{ padding: .35rem .7rem; border-radius: 8px; text-decoration: none; color: var(--p-tinta-suave); font-weight: 700; font-size: .9rem; }
  .g-menu a:hover{ background: var(--p-linha); color: var(--p-tinta); }
  .g-sec{ display: flex; flex-direction: column; gap: 1rem; scroll-margin-top: 4.5rem; }
  .g-sec > h2{ margin: 0; font-size: 1.4rem; }
  .g-sec > p{ margin: 0; color: var(--p-tinta-suave); max-width: 70ch; }
  .g-exemplo > header{ display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .g-exemplo > header strong{ font-size: 1.02rem; }
  .g-origem{ font-size: .7rem; font-weight: 800; padding: .1rem .6rem; border-radius: 999px; border: 1px solid var(--p-linha); color: var(--p-tinta-suave); white-space: nowrap; }
  .g-origem--pico{ background: color-mix(in srgb, var(--p-ok) 18%, transparent); color: var(--p-tinta); border-color: color-mix(in srgb, var(--p-ok) 50%, transparent); }
  .g-uso{ margin: 0 0 .75rem; color: var(--p-tinta-suave); font-size: .9rem; }
  .g-palco{ padding: 1rem; border: 1px dashed var(--p-linha); border-radius: var(--p-raio-controle); background: var(--p-bg); overflow-x: auto; }
  .g-palco > *:last-child{ margin-bottom: 0; }
  .g-exemplo details{ margin: .75rem 0 0; }
  .g-exemplo pre{ margin: .5rem 0 0; max-height: 22rem; overflow: auto; font-size: .78rem; }
  .g-tokens{ display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .75rem; }
  .g-token{ display: grid; grid-template-columns: 2.6rem 1fr; gap: .6rem; align-items: center; padding: .55rem; border: 1px solid var(--p-linha); border-radius: var(--p-raio-controle); background: var(--p-elevado); }
  .g-token i{ width: 2.6rem; height: 2.6rem; border-radius: 8px; border: 1px solid var(--p-linha); display: block; }
  .g-token b{ display: block; font-size: .85rem; }
  .g-token small{ display: block; color: var(--p-tinta-suave); font-size: .72rem; line-height: 1.3; }
  .g-par{ display: flex; gap: .5rem; flex-wrap: wrap; }
  @media (max-width: 900px){ .g-corpo{ grid-template-columns: 1fr; } .g-menu{ position: static; flex-direction: row; flex-wrap: wrap; max-height: none; } }
</style>
</head>
<body>
<div class="painel" id="raiz">
  <div class="g-topo">
    <strong>Guia de estilo do painel</strong>
    <div class="g-controles">
      <div class="g-seg" id="curso" role="group" aria-label="Curso">
        <button type="button" data-v="fr" aria-pressed="true">Francês</button>
        <button type="button" data-v="zh" aria-pressed="false">Mandarim</button>
      </div>
      <div class="g-seg" id="tema" role="group" aria-label="Tema">
        <button type="button" data-v="light" aria-pressed="true">Claro</button>
        <button type="button" data-v="dark" aria-pressed="false">Escuro</button>
      </div>
    </div>
  </div>
  <div class="g-corpo">
    <nav class="g-menu" id="menu" aria-label="Seções"></nav>
    <main class="p-pagina" id="conteudo"></main>
  </div>
</div>

/* ---------- Montagem ---------- */
var raiz = document.getElementById('raiz');
var html = document.documentElement;

function criar(tag, cls, texto){ var e = document.createElement(tag); if(cls) e.className = cls; if(texto != null) e.textContent = texto; return e; }

function montar(){
  var menu = document.getElementById('menu'), conteudo = document.getElementById('conteudo');
  var cab = criar('header','p-cabecalho');
  var cab1 = criar('div'); cab1.appendChild(criar('span','p-sobretitulo','Design System')); cab1.appendChild(criar('h1',null,'Guia de estilo do painel'));
  cab1.appendChild(criar('span','p-subtitulo','Pico CSS limitado ao painel, mais os tokens e componentes da Brune. Troque curso e tema no topo para conferir.'));
  cab.appendChild(cab1); conteudo.appendChild(cab);
  SECOES.forEach(function(s){
    var a = criar('a',null,s.titulo); a.href = '#'+s.id; menu.appendChild(a);
    var sec = criar('section','g-sec'); sec.id = s.id;
    sec.appendChild(criar('h2',null,s.titulo)); sec.appendChild(criar('p',null,s.texto));
    if(s.tokens){ var g = criar('div','g-tokens'); g.id = 'tokens'; sec.appendChild(g); }
    s.ex.forEach(function(ex){
      var art = criar('article','g-exemplo');
      var h = criar('header'); h.appendChild(criar('strong',null,ex.t));
      h.appendChild(criar('span','g-origem'+(ex.pico?' g-origem--pico':''), ex.so_codigo?'Instrução':(ex.pico?'Nativo do Pico':'Feito à mão')));
      art.appendChild(h);
      art.appendChild(criar('p','g-uso',ex.uso));
      if(!ex.so_codigo){ var palco = criar('div','g-palco'); palco.innerHTML = ex.html; art.appendChild(palco); }
      var det = criar('details'); det.appendChild(criar('summary',null,'Ver o HTML'));
      var pre = criar('pre'); pre.appendChild(criar('code',null,ex.html)); det.appendChild(pre); art.appendChild(det);
      sec.appendChild(art);
    });
    conteudo.appendChild(sec);
  });
  conteudo.appendChild(criar('p','p-subtitulo','Dados de exemplo. Nada aqui lê ou grava no Supabase.'));
}

function hex(rgb){ var m = rgb.match(/\d+(\.\d+)?/g); if(!m) return rgb; return '#'+m.slice(0,3).map(function(n){ return ('0'+Math.round(+n).toString(16)).slice(-2); }).join('').toUpperCase(); }
function pintarTokens(){
  var g = document.getElementById('tokens'); if(!g) return; g.textContent = '';
  TOKENS.forEach(function(t){
    var c = criar('div','g-token'); var i = criar('i'); i.style.background = 'var('+t[0]+')'; c.appendChild(i);
    var d = criar('div'); var b = criar('b',null,t[0]); var s1 = criar('small',null,t[1]); var s2 = criar('small',null,'vem de '+t[2]);
    var s3 = criar('small',null,hex(getComputedStyle(i).backgroundColor)); d.appendChild(b); d.appendChild(s1); d.appendChild(s2); d.appendChild(s3); c.appendChild(d); g.appendChild(c);
  });
}
function aplicar(curso, tema){
  html.setAttribute('data-curso', curso); html.setAttribute('data-theme', tema);
  document.querySelectorAll('#curso button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === curso)); });
  document.querySelectorAll('#tema button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === tema)); });
  pintarTokens();
  try{ localStorage.setItem('guia-painel', JSON.stringify({curso:curso, tema:tema})); }catch(e){}
}
var estado = {curso:'fr', tema: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'};
try{ var sv = JSON.parse(localStorage.getItem('guia-painel')||'{}'); if(sv.curso) estado.curso = sv.curso; if(sv.tema) estado.tema = sv.tema; }catch(e){}
montar(); aplicar(estado.curso, estado.tema);
document.getElementById('curso').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ estado.curso = b.getAttribute('data-v'); aplicar(estado.curso, estado.tema); } });
document.getElementById('tema').addEventListener('click', function(e){ var b = e.target.closest('button'); if(b){ estado.tema = b.getAttribute('data-v'); aplicar(estado.curso, estado.tema); } });
</script>
</body>
</html>
