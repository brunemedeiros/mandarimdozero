name: Deploy to GitHub Pages

# Publica o repositório inteiro (index.html da raiz + fr/ + zh/ +
# shared/) direto no GitHub Pages, sem passo de build --
# os dois apps e a página de seleção de idioma são HTML/JS puro. Roda a
# cada push em main, ou manualmente pela aba Actions do GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dois deploys em paralelo -- um push novo espera o anterior
# terminar em vez de cancelar no meio (evita publicar metade de cada).
concurrency:
  group: pages
  cancel-in-progress: false

# Duas etapas (2026-11-24): "build" monta e envia o pacote; "deploy" publica, só
# depois que a primeira termina. Com as duas na mesma etapa, o deploy-pages
# procurava o pacote ~0,3 s depois do envio e às vezes o GitHub ainda dizia
# "No artifacts named github-pages were found" (6 de 8 publicações falharam
# em 2026-11-24; falha conhecida, actions/deploy-pages#451). Separado, um
# "Re-run failed jobs" refaz só a publicação, com o mesmo pacote.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      # Versionamento automático do cache do Service Worker (Fase 4 da tarefa
      # PWA/mobile): troca o placeholder __BUILD_ID__ (ver fr/service-worker.js
      # e zh/service-worker.js) pelo SHA curto deste commit. Isso muda
      # CACHE_NAME em TODO deploy sem depender de ninguém lembrar de bumpar um
      # número à mão -- elimina o risco de "GitHub Pages atualizou, PWA
      # continua preso na versão antiga" por esquecimento. O mesmo SHA vai para
      # shared/pwa.js: a página compara a versão dela com a do SW novo e só
      # mostra "Nova versão disponível" se forem diferentes (2026-11-11).
      - name: Injeta versão do build no Service Worker
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/" fr/service-worker.js zh/service-worker.js shared/pwa.js

      # Lista do que as páginas principais podem carregar (CSP por <meta>; auditoria de segurança de 2026-11,
      # docs/historico/36-auditoria-seguranca-2026-11.md). Recalcula as impressões digitais do código solto de
      # index.html, fr/index.html e zh/index.html: se alguém mudou esse código e esqueceu de rodar o script,
      # o site publicado continua certo (o teste tests/csp/ avisa no repositório).
      - name: Atualiza a lista de segurança das páginas (CSP)
        run: node scripts/csp-atualizar.js

      - name: Empacota o site (sem build -- HTML/JS estático)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # O passo "syncing_files" do GitHub às vezes passa de 10 min (padrão do deploy-pages) e o deploy era cancelado
      # (PRs #452 e #453, 2026-11-09/10). Pedimos 30 min, mas o deploy-pages@v4 continua cancelando em 10 min (PR #459):
      # o valor não funciona como esperado. Quando acontecer, rodar o deploy de novo uma vez (até hoje passou na 2ª).
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
