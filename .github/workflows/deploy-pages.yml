name: Deploy to GitHub Pages

# Publica o repositório inteiro (index.html da raiz + fr/ + zh/ +
# shared/) direto no GitHub Pages, sem passo de build --
# os dois apps e a página de seleção de idioma são HTML/JS puro. Roda a
# cada push em main, ou manualmente pela aba Actions do GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dois deploys em paralelo -- um push novo espera o anterior
# terminar em vez de cancelar no meio (evita publicar metade de cada).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      # Versionamento automático do cache do Service Worker (Fase 4 da tarefa
      # PWA/mobile): troca o placeholder __BUILD_ID__ (ver fr/service-worker.js
      # e zh/service-worker.js) pelo SHA curto deste commit. Isso muda
      # CACHE_NAME em TODO deploy sem depender de ninguém lembrar de bumpar um
      # número à mão -- elimina o risco de "GitHub Pages atualizou, PWA
      # continua preso na versão antiga" por esquecimento.
      - name: Injeta versão do build no Service Worker
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/" fr/service-worker.js zh/service-worker.js

      - name: Empacota o site (sem build -- HTML/JS estático)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
