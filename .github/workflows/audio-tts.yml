name: Áudio TTS

# Rodado à mão (aba Actions > Áudio TTS > Run workflow). A chave do Google vive
# só no Secret GCP_TTS_KEY -- nunca em arquivo do repositório.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "laboratorio = gera variantes pra ouvir | regenerar = refaz os mp3 afetados pelas regras | gerar-faltantes = cria mp3 para textos sem áudio (zh e fr) | desafios-expressoes = gera os mp3 das 80 expressões novas dos Desafios | desafios-a1-m1 = gera os mp3 dos desafios do Módulo 1 do A1 | desafios-a1-todos = gera os mp3 dos desafios dos Módulos 1 a 6 do A1 (fr/scripts/challenges_import) | ditados-frases = gera 1 mp3 por FRASE de cada ditado (dictation-<id>-s<N>.mp3) | ditados = refaz o áudio guiado de TODOS os ditados de fr/dictations.js (com a locução de instruções em português) | ditados-en = gera a versão com as instruções em INGLÊS (dictation-<id>-guided.en.mp3) para o site em inglês"
        type: choice
        options: [laboratorio, regenerar, gerar-faltantes, desafios-expressoes, desafios-a1-m1, desafios-a1-todos, ditados, ditados-frases, ditados-en]
        default: laboratorio

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-24.04
    env:
      GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests miniaudio
      - name: Conferir chave
        run: test -n "$GCP_TTS_KEY" || (echo "Secret GCP_TTS_KEY não configurado" && exit 1)
      - name: Laboratório
        if: inputs.modo == 'laboratorio'
        run: python3 fr/scripts/audio_lab.py
      - uses: actions/upload-artifact@v6
        if: inputs.modo == 'laboratorio'
        with:
          name: laboratorio-audio
          path: fr/scripts/lab_output/
      - name: Regenerar
        if: inputs.modo == 'regenerar'
        run: python3 fr/scripts/regenerate_spoken_audio.py
      - name: Gerar faltantes (zh)
        if: inputs.modo == 'gerar-faltantes'
        run: node fr/scripts/list_missing_audio.js zh | python3 fr/scripts/generate_missing_audio.py zh
      - name: Gerar faltantes (fr)
        if: always() && inputs.modo == 'gerar-faltantes'
        run: node fr/scripts/list_missing_audio.js fr | python3 fr/scripts/generate_missing_audio.py fr
      - name: Gerar áudio das expressões dos Desafios
        if: inputs.modo == 'desafios-expressoes'
        run: python3 fr/scripts/challenges_import/generate_challenge_audio.py
      - name: Gerar áudio dos desafios do Módulo 1 (A1)
        if: inputs.modo == 'desafios-a1-m1'
        run: python3 fr/scripts/challenges_import/generate_challenge_audio.py fr/scripts/challenges_import/lote-a1-m1.json
      - name: Gerar áudio dos desafios dos Módulos 1 a 6 (A1)
        if: inputs.modo == 'desafios-a1-todos'
        run: |
          for m in 1 2 3 4 5 6; do
            python3 fr/scripts/challenges_import/generate_challenge_audio.py fr/scripts/challenges_import/lote-a1-m$m.json
          done
      - name: Gerar áudio guiado dos ditados
        if: inputs.modo == 'ditados'
        env:
          DICTATION_FORCE: "1"
        run: python3 fr/scripts/gen_guided_dictation_audio.py
      - name: Gerar áudio guiado dos ditados (instruções em inglês)
        if: inputs.modo == 'ditados-en'
        env:
          DICTATION_FORCE: "1"
          DICTATION_UI_LANG: "en"
        run: python3 fr/scripts/gen_guided_dictation_audio.py

      - name: Gerar áudio por frase dos ditados
        if: inputs.modo == 'ditados-frases'
        env:
          DICTATION_FORCE: "1"
        run: python3 fr/scripts/gen_dictation_sentence_audio.py

      - name: Commitar
        if: always() && inputs.modo != 'laboratorio'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fr/audio fr/audio-manifest.js zh/audio zh/audio-manifest.js
          git diff --cached --quiet || git commit -m "Áudio TTS (${{ inputs.modo }}): mp3 gerados com Chirp 3 HD"
          # O main pode ter mudado durante a geração (merge de outro PR):
          # atualiza por rebase antes de enviar, com algumas tentativas.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não foi possível enviar após 3 tentativas" >&2
          exit 1
      # Commits feitos pelo próprio workflow (GITHUB_TOKEN) NÃO disparam a
      # publicação do site sozinhos -- pede explicitamente.
      - name: Publicar o site
        if: always() && inputs.modo != 'laboratorio'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
